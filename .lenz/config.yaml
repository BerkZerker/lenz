languages:
  - typescript
  - tsx
source_globs:
  - "**/*.ts"
  - "**/*.tsx"
  - "**/*.js"
  - "**/*.jsx"
  - "**/*.py"
  - "**/*.go"
ignore_globs:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.lenz/**"
  - "**/*.d.ts"
  - "packages/core/static/**"
entry_globs:
  - "**/src/{index,main,server,cli,app}.{ts,tsx,js}"
  - "{index,main,server,cli,app}.{ts,tsx,js}"
  - "**/main.py"
  - "**/__main__.py"
  - "**/main.go"
  - "**/cmd/*/main.go"
orphan_exclude:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/tests/**"
  - "**/test/**"
  - "**/__tests__/**"
  - "**/*.config.*"
  - "**/*.generated.*"
test_command: bun test
max_concurrent_runs: 2
lock_cooldown: 45
run_timeout: 1200
example_timeout: 60
port: 7331
llm:
  provider: gemini
  model: gemini-3.7-flash
