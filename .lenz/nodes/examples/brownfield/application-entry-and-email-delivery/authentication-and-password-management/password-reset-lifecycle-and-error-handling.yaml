summary: This behavior manages the end-to-end password reset workflow, handling temporary token
  generation, reset email dispatch, in-memory token state tracking, and structured error handling
  for invalid or expired requests. When a user submits a valid token to complete a reset, it updates
  the credentials and delegates the new password transformation to [[n_75aa24]].
