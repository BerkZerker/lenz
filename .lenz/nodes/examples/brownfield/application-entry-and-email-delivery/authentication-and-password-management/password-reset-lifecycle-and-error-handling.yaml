kind: behavior
title: Password Reset Lifecycle and Error Handling
spec: Handles password reset operations by generating temporary tokens, sending reset emails,
  storing active tokens in memory, consuming valid tokens to update passwords, and raising
  structured ResetError exceptions when invalid or expired tokens are encountered.
