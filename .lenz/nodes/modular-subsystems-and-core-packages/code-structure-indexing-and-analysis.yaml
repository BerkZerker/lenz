summary: This module serves as the core code intelligence and structural analysis engine,
  responsible for extracting and tracking symbols, references, and dependency relationships across
  multi-language codebases. It utilizes Tree-sitter queries and SCIP data to populate and update an
  SQLite-backed index, maintaining synchronization through debounced filesystem watching while
  generating static call trees and anchor-based symbol stability tracking. Its indexing routines and
  symbol query capabilities are primarily invoked by [[n_0e8e26]].
