kind: intent
title: Code Structure Indexing and Analysis
spec: This area implements the core code intelligence engine that extracts, resolves, and tracks
  structural elements across a codebase. It parses source files in supported languages using
  Tree-sitter queries and optional SCIP data, extracting symbol declarations, signatures, imports,
  and cross-file references into an SQLite database. It provides filesystem watching and ignore-rule
  filtering for incremental re-indexing, resolves syntactic relationships, tracks symbol stability
  across edits using anchors, and generates static call trees from entry points.
