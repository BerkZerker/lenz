kind: behavior
title: AST code extraction of symbols, references, and imports
spec: Parses source files using Tree-sitter queries for the file's language. Identifies symbol
  declarations, inspects container hierarchies (`containerOf`), strips implementation bodies for
  signatures (`signatureOf`), filters function-local nodes (`isFunctionLocal`), tracks builtin
  constructor/receiver bindings, and extracts symbols, raw references (`RawRef`), and import
  bindings into an `Extraction` bundle. Returns `null` if the language is unsupported.
parent: n_73cee3
status: proposed
examples:
  - id: ex_cf8a71
    name: Extracting symbols and references from source
    given: A relative path and source code text in a recognized language.
    when: extractFile is called with the path and source text.
    then: The AST is queried and parsed, returning an Extraction object with symbols, raw references,
      import bindings, language ID, and content hash.
    expect:
      mode: manual
    derived: true
  - id: ex_3225f5
    name: Handling unsupported file extensions
    given: A file path with an unconfigured or unknown file extension.
    when: extractFile is called.
    then: It returns null without attempting to parse.
    expect:
      mode: manual
    derived: true
derived: true
