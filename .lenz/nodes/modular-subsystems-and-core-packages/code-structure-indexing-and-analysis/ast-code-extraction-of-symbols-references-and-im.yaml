summary: This node parses source files using Tree-sitter queries to extract symbols, signatures,
  container hierarchies, raw references, and import bindings into structured extraction bundles. It
  relies on parser loading and language configurations from [[n_790227]], [[n_d27685]], and
  [[n_1c6d8c]], while using [[n_1442b1]] for text hashing and packaging output into the schema
  defined by [[n_5608cc]]. Upstream, these extraction bundles are consumed to drive codebase
  indexing and synchronization in [[n_d12a81]] and syntactic reference resolution in [[n_ef236d]].
