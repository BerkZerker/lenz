summary: This behavior maintains an incremental, SQLite-backed structural index of the codebase,
  tracking source files, symbols, and dependencies while serving queries for code snippets and
  metadata. During indexing, it filters paths via [[n_ee0acb]] and [[n_8861f2]], hashes content with
  [[n_1442b1]], determines languages using [[n_d27685]] and [[n_790227]], extracts symbols and
  references through [[n_329a75]], [[n_1c6d8c]], and [[n_ef236d]], and formats and persists data
  using [[n_5608cc]] into [[n_58299f]]. It is initialized via [[n_81d7fd]] and driven by
  [[n_77901c]], [[n_836db2]], and [[n_759ab4]], supplying structural intelligence to downstream
  features in [[n_1cef8b]], [[n_b3b72e]], [[n_484bc9]], [[n_80e676]], and [[n_c04098]].
