kind: behavior
title: Codebase structure indexing, synchronization, and symbol queries
spec: Configures and manages an SQLite-backed code structure index (StructureIndex). Filters source
  files using glob patterns and ignore files (.gitignore, .lenzignore), incrementally hashes and
  extracts file symbols and imports, updates dependency graphs upon modification or deletion,
  auto-detects entry points, and provides helper accessors for relative paths, symbol source code
  snippets, and modification times.
parent: n_73cee3
status: proposed
examples:
  - id: ex_fac629
    name: full-project-index
    given: A StructureIndex instance configured for a project directory
    when: indexAll() is invoked
    then: It reloads ignore rules, scans source files matching source globs, updates files and symbols
      in the database, and returns the SymbolsChanged changeset
    expect:
      mode: manual
    derived: true
  - id: ex_8c350f
    name: retrieve-symbol-source
    given: An indexed symbol key stored in the structure database
    when: symbolSource(key) is called
    then: It reads the corresponding source file and returns the slice of lines between the symbol's
      start_line and end_line
    expect:
      mode: manual
    derived: true
derived: true
