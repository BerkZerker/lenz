    name: Ancestor directory exclusion
    given: Ignore rules parsed from 'node_modules/' and '!node_modules/keep.js'
    when: isIgnored is evaluated on 'node_modules/keep.js'
    then: It returns true because the ancestor directory 'node_modules' matched an exclusion rule before
      the child path was evaluated
    expect:
      mode: manual
    derived: true
  - id: ex_c009ee
    name: Pattern negation and unslashed wildcard matching
    given: Ignore rules parsed from '*.log\n!important.log'
    when: isIgnored is evaluated on 'src/error.log' and 'src/important.log'
    then: "'src/error.log' returns true matching the glob at any depth, and 'src/important.log' returns
      false due to negation rule precedence"
    expect:
      mode: manual
    derived: true
