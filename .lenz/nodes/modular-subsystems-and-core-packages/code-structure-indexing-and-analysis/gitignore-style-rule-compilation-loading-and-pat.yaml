summary: This behavior compiles gitignore-style glob patterns into regular expression rules and
  evaluates project-relative paths to determine whether files and directories should be excluded. It
  reads ignore files from disk, correctly handling sequential overrides, directory constraints, and
  ancestor path exclusions. Its default templates are consumed during project setup in [[n_19d7fc]],
  while its rule loading and matching routines are relied upon by [[n_d12a81]] for structural
  indexing and by [[n_759ab4]] to filter filesystem watch events.
