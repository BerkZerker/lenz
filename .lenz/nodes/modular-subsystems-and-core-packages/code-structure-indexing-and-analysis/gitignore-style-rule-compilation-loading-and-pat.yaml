kind: behavior
title: Gitignore-style rule compilation, loading, and path matching
spec: Compiles gitignore pattern lines into IgnoreRule objects containing anchored regular
  expressions, negation flags, and directory-only constraints. Handles comments (#), escaped
  characters (\#, \!), glob patterns (*, **, ?), and character sets ([...]), with unslashed patterns
  matching at any depth. Loads ignore rules in sequential order from specified files on disk
  (defaulting to .gitignore and .lenzignore via IGNORE_FILES), skipping missing files. Tests
  project-relative POSIX paths (isIgnored) by evaluating every ancestor path segment in order;
  directory-only rules apply exclusively to intermediate path segments, later matching rules
  override earlier ones, and an ignored ancestor directory immediately marks the path as excluded.
  Provides DEFAULT_LENZIGNORE containing default ignore template comments and patterns.
