summary: This behavior configures the language definition for Go source files, handling file
  matching, import parsing, and symbol export rules. It inspects symbol identifiers to determine
  public visibility based on standard capitalization conventions and walks the abstract syntax tree
  to extract package aliases and module paths into structured bindings. It operates as a
  self-contained language handler that leaves same-package symbol resolution to local file contexts.
