summary: This node serves as the central registry for supported programming languages, defining
  language metadata interfaces, matching file extensions to configurations, and resolving filesystem
  paths for Tree-sitter WASM grammars and query files. Its asset path resolution helpers are
  leveraged by [[n_790227]] to load parser artifacts, while [[n_d12a81]] relies on its file-matching
  helpers during codebase synchronization and indexing. Furthermore, its language definitions and
  binding schemas provide the foundational contracts utilized by [[n_329a75]] for AST symbol and
  import extraction.
