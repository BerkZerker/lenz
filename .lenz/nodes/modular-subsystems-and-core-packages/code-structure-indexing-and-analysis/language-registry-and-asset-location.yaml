kind: behavior
title: Language registry and asset location
spec: "Defines language metadata interfaces (ImportBinding, LanguageDef) and maintains the
  registered list of supported languages (LANGUAGES: TypeScript, TSX, Python, Go). Provides
  languageForFile to match file extensions against registered languages, and helpers wasmPath and
  queryPath to resolve filesystem paths to compiled Tree-sitter WASM grammars (under
  tree-sitter-wasms/out) and Tree-sitter query files (under ../queries)."
parent: n_73cee3
status: proposed
examples:
  - id: ex_bddcc0
    name: Lookup language by extension
    given: A file path 'src/app.ts' and the registered LANGUAGES list
    when: calling languageForFile('src/app.ts')
    then: returns the TypeScript LanguageDef with id 'typescript'
    expect:
      mode: manual
    derived: true
  - id: ex_a759a8
    name: Lookup unsupported language extension
    given: A file path 'README.md' with an unregistered extension
    when: calling languageForFile('README.md')
    then: returns null
    expect:
      mode: manual
    derived: true
derived: true
