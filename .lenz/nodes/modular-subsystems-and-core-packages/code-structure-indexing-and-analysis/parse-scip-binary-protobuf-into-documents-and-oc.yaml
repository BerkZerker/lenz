kind: behavior
title: Parse SCIP binary protobuf into documents and occurrences
spec: Decodes a binary SCIP (Source Code Intelligence Protocol) protobuf buffer (`Uint8Array`) into
  an array of `ScipDocument` objects. Uses a minimal varint and protobuf wire format parser to
  extract document entries (field 2) containing file paths (document field 1) and occurrences
  (document field 2). For each occurrence, parses symbol string identifiers (field 2), role bitmasks
  (field 3), and integer range sequences (field 1) supporting both 3-element single-line ranges
  `[line, startCol, endCol]` and 4-element multi-line ranges `[startLine, startCol, endLine,
  endCol]`.
parent: n_73cee3
status: proposed
examples:
  - id: ex_11ff2a
    name: Parse document with symbol occurrence
    given: A SCIP protobuf buffer representing a document at 'src/index.ts' with an occurrence having a
      3-element range [10, 2, 8], symbol 'scip-ts npm pkg 1.0.0 src/foo().', and role 1 (definition)
    when: parseScip(buf) is called with the binary buffer
    then: Returns an array containing a ScipDocument with path 'src/index.ts' and an occurrence where
      startLine=10, startCol=2, endLine=10, endCol=8, symbol='scip-ts npm pkg 1.0.0 src/foo().', and
      roles=1
    expect:
      mode: manual
    derived: true
  - id: ex_eaf6c3
    name: Parse multi-line range occurrence
    given: A SCIP protobuf buffer containing an occurrence with a 4-element range [5, 0, 8, 12]
    when: parseScip(buf) is called
    then: The decoded occurrence has startLine=5, startCol=0, endLine=8, and endCol=12
    expect:
      mode: manual
    derived: true
derived: true
