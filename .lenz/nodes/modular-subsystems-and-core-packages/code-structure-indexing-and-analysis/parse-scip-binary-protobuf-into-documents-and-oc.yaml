summary: This behavior decodes raw SCIP protobuf binary buffers into structured document objects
  containing file paths, symbol occurrences, and source range mappings. It serves as a lightweight
  wire-format parser that is invoked by [[n_298de6]] to enrich code references with indexed symbol
  metadata.
