kind: behavior
title: Python language definition and module resolution
spec: Configures LanguageDef for Python (python) matching .py files. Considers identifiers not
  starting with '_' to be exported. Parses standard and aliased import statements and from ...
  import clauses into ImportBinding records (parseImport). Resolves module specifiers
  (resolveModule) by mapping dotted notation relative to the importing file or project root and
  checking for matching .py files or __init__.py package directories.
parent: n_73cee3
status: proposed
examples:
  - id: ex_59e94c
    name: Determine Python export status by name
    given: Symbol names '_helper' and 'run_server'
    when: calling python.isExported on both names
    then: returns false for '_helper' and true for 'run_server'
    expect:
      mode: manual
    derived: true
  - id: ex_c3013b
    name: Resolve relative Python package
    given: A file at '/root/pkg/app.py' importing relative module '.sub' where
      '/root/pkg/sub/__init__.py' exists
    when: calling python.resolveModule('/root/pkg/app.py', '.sub', '/root')
    then: returns '/root/pkg/sub/__init__.py'
    expect:
      mode: manual
    derived: true
derived: true
