kind: behavior
title: SCIP index reference enrichment
spec: Parses an index.scip file if present at the project root, maps definition occurrences to
  database symbol keys by matching file lines and names, deletes prior SCIP-provenance references,
  and inserts updated reference edges into the structure database.
parent: n_73cee3
status: proposed
examples:
  - id: ex_cb3b69
    name: apply-scip-when-file-missing
    given: A project root directory without an index.scip file
    when: applyScip() is called
    then: It immediately returns null without modifying the database
    expect:
      mode: manual
    derived: true
  - id: ex_3fa6c1
    name: apply-scip-when-file-present
    given: An index.scip file located at the project root containing reference occurrences for indexed
      symbols
    when: applyScip() is called
    then: It resolves reference destinations, deletes existing SCIP references, inserts the new
      references, and returns the total count of inserted edges
    expect:
      mode: manual
    derived: true
derived: true
