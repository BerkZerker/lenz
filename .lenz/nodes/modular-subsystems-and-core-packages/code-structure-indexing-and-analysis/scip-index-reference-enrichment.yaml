summary: This behavior enriches project code intelligence by ingesting an index.scip file to map
  symbol occurrences to existing database records and replace stale reference edges. It relies on
  [[n_7cd39e]] to decode the raw protobuf documents, uses [[n_5608cc]] for symbol models and key
  manipulation, and commits the resolved references into storage using [[n_58299f]]. The enrichment
  workflow is invoked across system startup, command execution, and service lifecycles coordinated
  by [[n_836db2]], [[n_77901c]], and [[n_c04098]].
