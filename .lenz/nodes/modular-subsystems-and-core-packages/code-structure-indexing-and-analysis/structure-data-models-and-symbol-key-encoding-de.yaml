kind: behavior
title: Structure data models and symbol key encoding/decoding
spec: Defines data types and interfaces for structural code entities (including SymbolKind, RefKind,
  Provenance, SymbolRow, RefRow, UnresolvedRow, ImportRow, Anchor, and SymbolsChanged) and provides
  utility functions to construct and parse compound symbol keys formatted as
  `${file}#${container}#${kind}#${name}`. When parsing keys, if the delimiter count is insufficient
  (fewer than 3 parts after the initial file separator), it returns null; otherwise, any additional
  '#' characters are joined back into the symbol name.
parent: n_73cee3
status: proposed
examples:
  - id: ex_7ec599
    name: Format symbol components into a compound key
    given: A symbol object with file 'src/index.ts', container 'App', kind 'class', and name 'start'
    when: symbolKey is called with this object
    then: It returns the string 'src/index.ts#App#class#start'
    expect:
      mode: manual
    derived: true
  - id: ex_bc01ef
    name: Parse valid compound symbol key with extra delimiters in name
    given: A key string 'src/types.ts##type#A#B'
    when: parseKey is called with the key string
    then: It returns an object with file 'src/types.ts', container '', kind 'type', and name 'A#B'
    expect:
      mode: manual
    derived: true
  - id: ex_3adfdb
    name: Parse invalid symbol key missing delimiters
    given: A key string 'src/types.ts#singlePart'
    when: parseKey is called with the key string
    then: It returns null
    expect:
      mode: manual
    derived: true
derived: true
