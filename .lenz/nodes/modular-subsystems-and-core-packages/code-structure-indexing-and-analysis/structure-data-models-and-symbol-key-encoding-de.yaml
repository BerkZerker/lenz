summary: This node establishes foundational structural data types—such as symbols, references, and
  anchors—and provides utilities to format and parse compound symbol identifiers. These schemas form
  the core contract for source extraction, indexing, and storage pipelines in [[n_329a75]],
  [[n_298de6]], [[n_ef236d]], [[n_d12a81]], and [[n_58299f]]. Higher-level analysis, anchor
  tracking, and system lifecycle orchestrations across [[n_08fed0]], [[n_fb7815]], [[n_c8c898]],
  [[n_19fac0]], [[n_1cef8b]], [[n_b3b72e]], [[n_7671f2]], [[n_484bc9]], [[n_80e676]], and
  [[n_77901c]] directly consume these entities.
