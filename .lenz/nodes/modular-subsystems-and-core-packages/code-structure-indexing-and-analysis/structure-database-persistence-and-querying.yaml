kind: behavior
title: Structure database persistence and querying
spec: Initializes and manages an SQLite database (using WAL mode and NORMAL synchronous settings)
  for storing and querying code structure artifacts across files, symbols, imports, symbol
  references, unresolved references, entry points, and node anchor mappings. Supports transactional
  execution, batch replacements of symbols and imports per file, cascading deletions when files are
  removed, and querying symbol relations, owners, orphans, and neighbor nodes.
parent: n_73cee3
status: proposed
examples:
  - id: ex_c26e1d
    name: Track and delete indexed file metadata and associated symbols
    given: An empty StructureDb instance
    when: upsertFile is called for 'src/index.ts' with a hash and language, followed by replaceSymbols
      for the file, and then deleteFile('src/index.ts') is called
    then: fileHash('src/index.ts') returns null, symbolsInFile('src/index.ts') returns an empty array,
      and any associated refs, unresolved entries, and auto entry points are deleted
    expect:
      mode: manual
    derived: true
  - id: ex_38a50d
    name: Query orphan symbols not mapped to anchors
    given: A StructureDb with a symbol stored under key 'sym1' and no anchor mapping referencing 'sym1'
    when: orphans() is called
    then: The returned list includes the symbol row for 'sym1'
    expect:
      mode: manual
    derived: true
derived: true
