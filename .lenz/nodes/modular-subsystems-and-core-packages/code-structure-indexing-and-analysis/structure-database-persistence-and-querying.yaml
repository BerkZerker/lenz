id: n_58299f
deps: []
summary: This node provides persistent SQLite storage and transactional querying for indexed
  codebase structural data, including files, symbols, references, and anchor mappings. It formats
  and converts database records using the schema models and symbol key utilities provided by
  [[n_5608cc]]. It serves as a central data foundation across the system, supplying storage and
  query capabilities to indexing and reference resolution in [[n_d12a81]], [[n_ef236d]], and
  [[n_298de6]], anchor and relation tracking in [[n_08fed0]], [[n_c8c898]], [[n_c26d86]], and
  [[n_ab4a86]], architecture analysis in [[n_b3b72e]], [[n_5ffc74]], [[n_1cef8b]], and [[n_7671f2]],
  and broader lifecycle orchestration across [[n_836db2]], [[n_77901c]], [[n_c04098]], [[n_20e5ea]],
  and [[n_484bc9]].
