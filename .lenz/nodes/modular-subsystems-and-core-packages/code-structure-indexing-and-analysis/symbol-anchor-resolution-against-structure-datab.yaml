kind: behavior
title: Symbol anchor resolution against structure database
spec: "Converts symbol rows to anchor representations and resolves an existing anchor against a
  StructureDb by matching symbol key, body, file, container, and signature. Returns an
  AnchorResolution indicating status ('ok', 'changed', 'moved', 'renamed', or 'deleted'), the
  resolved anchor, key, and whether drift occurred: returns 'ok' (drift: false) if exact key matches
  and body is identical; 'changed' (drift: true) if exact key matches but body differs; 'moved'
  (drift: false) if matching body and name exist elsewhere or if a single matching body and kind
  exist; 'renamed' (drift: false) if a single symbol in the same file matches container/kind/sig
  (with or without matching body); or 'deleted' (drift: true) if no matching symbol is found."
parent: n_73cee3
status: proposed
examples:
  - id: ex_3c64c3
    name: resolves exact symbol match without changes as ok
    given: A StructureDb containing a symbol matching an anchor's key and identical body hash
    when: resolveAnchor(db, anchor) is called
    then: It returns status 'ok', drift false, the anchor key, and the anchor constructed from the
      database row
    expect:
      mode: manual
    derived: true
  - id: ex_1ee525
    name: detects body changes on an existing symbol as changed drift
    given: A StructureDb containing a symbol matching the anchor's key but with a different body hash
    when: resolveAnchor(db, anchor) is called
    then: It returns status 'changed', drift true, the anchor key, and the updated anchor from the
      database
    expect:
      mode: manual
    derived: true
  - id: ex_e80eb0
    name: marks missing symbols without match as deleted
    given: A StructureDb with no exact match, no relocated body match, and no renamed file/signature
      match for the anchor
    when: resolveAnchor(db, anchor) is called
    then: It returns status 'deleted', drift true, the original anchor key, and the original anchor
    expect:
      mode: manual
    derived: true
derived: true
