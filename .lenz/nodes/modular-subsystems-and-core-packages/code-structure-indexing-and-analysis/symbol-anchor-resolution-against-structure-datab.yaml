summary: This behavior converts symbol records into anchor representations and resolves existing
  anchors against a structure database to determine whether code elements are unchanged, modified,
  moved, renamed, or deleted. To evaluate matches and construct resolution results, it queries
  symbol indexes via [[n_58299f]], formats keys using [[n_fb7815]], and produces anchor models
  defined in [[n_5608cc]]. These resolution outcomes are then consumed by drift management workflows
  in [[n_c8c898]], build verification in [[n_484bc9]], and brownfield architecture derivation in
  [[n_b3b72e]].
