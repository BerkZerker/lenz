kind: behavior
title: Text normalization and content hashing
spec: "Provides hashing and whitespace normalization functions: `normalize` strips multi-line block
  comments, single-line slashes and hash comments, and collapses multi-whitespace down to single
  spaces; `hashText` computes a truncated 12-character SHA-1 hex digest; and `contentHash` computes
  a full 40-character SHA-1 hex digest."
parent: n_73cee3
status: proposed
examples:
  - id: ex_51bc39
    name: Normalizing commented code and hashing
    given: A code snippet containing inline block comments, slash comments, and irregular whitespace.
    when: normalize is called on the code snippet.
    then: All comments are removed and remaining tokens are separated by single spaces with
      leading/trailing whitespace trimmed.
    expect:
      mode: manual
    derived: true
  - id: ex_267267
    name: Hashing source text
    given: A string of source code.
    when: hashText is called on the string.
    then: A 12-character hexadecimal SHA-1 prefix string is returned.
    expect:
      mode: manual
    derived: true
derived: true
