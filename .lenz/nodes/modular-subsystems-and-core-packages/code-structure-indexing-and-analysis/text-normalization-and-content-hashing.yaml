summary: This behavior provides text sanitization and SHA-1 hashing utilities that strip comments,
  collapse whitespace, and generate full or truncated content digests. It serves as a core helper
  called by [[n_329a75]] during AST symbol and reference extraction, as well as by [[n_d12a81]] to
  detect content changes during codebase synchronization.
