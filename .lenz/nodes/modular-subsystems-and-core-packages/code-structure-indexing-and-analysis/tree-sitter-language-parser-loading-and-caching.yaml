kind: behavior
title: Tree-sitter language parser loading and caching
spec: Initializes the Tree-sitter WASM engine once via `ensureInit`, and compiles and caches parsers
  and language queries keyed by language ID in `langCache` via `loadLanguage`. `preloadLanguages`
  iterates over configured language definitions (or a specified subset) to warm up parser caches.
