kind: behavior
title: TypeScript and TSX language definition and resolution
spec: Configures LanguageDef for TypeScript and TSX (typescript, tsx) covering extensions .ts, .mts,
  .cts, .tsx, .jsx, .js, .mjs, and .cjs. Identifies exported AST nodes by traversing parent nodes
  for export_statement or exported class declarations (tsIsExported). Parses import and export
  statements into local, imported, and source bindings (tsParseImport). Resolves module specifiers
  (tsResolve) for relative, absolute, or bare workspace package specifiers discovered via
  package.json workspace globs (workspacePackages), testing file extensions and index files.
parent: n_73cee3
status: proposed
examples:
  - id: ex_d5a292
    name: Resolve relative TypeScript module
    given: A TypeScript file at '/project/src/index.ts' importing './utils' where
      '/project/src/utils.ts' exists
    when: calling typescript.resolveModule('/project/src/index.ts', './utils', '/project')
    then: returns '/project/src/utils.ts'
    expect:
      mode: manual
    derived: true
  - id: ex_37ce1f
    name: Determine if TypeScript AST node is exported
    given: A syntax node contained within an export_statement
    when: evaluating tsIsExported(node, 'myFunc')
    then: returns true
    expect:
      mode: manual
    derived: true
derived: true
