summary: This behavior provides language definition and module resolution support for TypeScript,
  TSX, and JavaScript source files across standard script extensions. It inspects AST structures to
  detect exported declarations, parses import and export statements into local and source bindings,
  and resolves module specifiers against file paths, index fallbacks, and workspace packages. It
  operates as a self-contained language configuration component without explicit external node
  links.
