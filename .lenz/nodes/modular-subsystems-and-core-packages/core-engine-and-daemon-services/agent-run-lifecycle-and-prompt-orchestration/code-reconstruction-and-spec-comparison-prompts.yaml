title: Code reconstruction and spec comparison prompts
spec: "Constructs prompts for independent code review: reconstructPrompt formats source code blocks
  and callee signatures into an instruction to describe code behavior without external context, and
  comparePrompt formats a spec, examples, and reconstruction into an instruction to output a JSON
  verdict ('match' or 'mismatch') with reasons."
