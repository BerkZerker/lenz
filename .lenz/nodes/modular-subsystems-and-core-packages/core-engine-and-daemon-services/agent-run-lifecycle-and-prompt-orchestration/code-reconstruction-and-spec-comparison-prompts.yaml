summary: This behavior generates structured prompts to facilitate independent, two-stage code
  verification against formal requirements. It prepares instructions for models to infer and
  describe code behavior in isolation, as well as comparison prompts that evaluate those
  reconstructions against target specifications to produce a structured JSON verdict. It currently
  serves as a self-contained prompt-construction module with no explicit upstream callers or
  downstream handoffs mapped in the project.
