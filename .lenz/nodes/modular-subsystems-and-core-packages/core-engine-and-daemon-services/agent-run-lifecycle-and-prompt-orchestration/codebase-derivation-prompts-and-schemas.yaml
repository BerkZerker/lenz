kind: behavior
title: Codebase derivation prompts and schemas
spec: Provides JSON schemas and prompt builders for bottom-up codebase derivation. Defines
  FILE_SCHEMA for deriving behavior nodes referencing bracketed symbol indexes, FOLDER_SCHEMA for
  intent nodes, filePrompt to format unowned symbols and their docs/sources within a single file,
  and folderPrompt to name and summarize folders based on child nodes.
parent: n_80e676
status: proposed
examples:
  - id: ex_fe306f
    name: Formats file derivation prompt
    given: A file path 'src/foo.ts' and an array of DeriveSymbol objects with indices and signatures
    when: filePrompt is called
    then: Returns a prompt instructing the LLM to group symbols by bracketed indices into behaviors
      matching FILE_SCHEMA
    expect:
      mode: manual
    derived: true
  - id: ex_7ad257
    name: Formats folder intent derivation prompt
    given: A folder path 'src/runs' and a list of derived child node titles and specs
    when: folderPrompt is called
    then: Returns a prompt instructing the LLM to produce an intent node title and one-paragraph spec
      matching FOLDER_SCHEMA
    expect:
      mode: manual
    derived: true
derived: true
