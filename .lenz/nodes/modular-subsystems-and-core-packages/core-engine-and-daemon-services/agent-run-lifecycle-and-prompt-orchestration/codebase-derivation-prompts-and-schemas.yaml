summary: This node provides the structured JSON schemas and prompt templates used for bottom-up
  codebase derivation, translating raw source symbols and folder hierarchies into behavior and
  intent nodes. It formats unowned symbols, source documentation, and child node contexts into
  guided prompts that enforce consistent output structures for files and directories. Once nodes are
  extracted, they hand off directly to [[n_2f337f]] for subsequent refinement, summary generation,
  and YAML serialization.
