kind: behavior
title: Generating Claude settings hook configuration
spec: Writes a Claude settings JSON file to the target path configuring `PreToolUse` and
  `PostToolUse` hooks that invoke the runner's CLI hook subcommands with shell-escaped arguments for
  run ID and broker port. Configures PreToolUse hooks for write tools
  ('Write|Edit|MultiEdit|NotebookEdit|Bash') with hook 'pre' and read tools ('Read|Glob|Grep') with
  hook 'notices', PostToolUse hooks for write tools with hook 'post', and includes the optional
  model name when provided.
parent: n_80e676
status: proposed
examples:
  - id: ex_c6326f
    name: Writing Claude settings JSON with hooks
    given: "Target path '/tmp/claude_settings.json' and options { cli: ['lenz'], runId: 'run-1', port:
      4000, model: 'claude-3-7-sonnet' }"
    when: writeClaudeSettings is executed
    then: A JSON file is written containing the model specification and PreToolUse / PostToolUse hook
      command strings with 20s timeouts invoking 'lenz hook pre/post/notices --run run-1 --port
      4000'
    expect:
      mode: manual
    derived: true
