summary: This behavior handles loading agent adapter configurations from YAML files and assembling
  ready-to-run execution command strings. It applies configuration defaults and safely interpolates
  dynamic parameters—such as session identifiers and prompt file paths—into command or resume
  templates. It is invoked by [[n_ba9088]] to initialize adapter settings and build the final
  command line arguments before executing agent runs.
