summary: This node provides prompt templates and formatting utilities for serializing node metadata
  into YAML, updating behavior specifications against current code sources, and generating concise
  graph orientation summaries. It does not call downstream nodes directly, but its text-formatting
  helpers are relied on by [[n_bcdd4d]] and [[n_136d52]] to support their respective prompt
  construction workflows.
