kind: behavior
title: Node rewriting, YAML conversion, and orientation summary prompts
spec: Provides helper utilities (oneLine, nodeToYamlForPrompt) and prompts for rewriting behavior
  nodes and generating orientation summaries. Defines BEHAVIOR_SCHEMA for rewriting behavior nodes
  from current code sources via behaviorPrompt, and constructs summaryPrompt to generate concise
  prose orientation summaries linking related nodes via bracketed IDs.
parent: n_80e676
status: proposed
examples:
  - id: ex_0eec89
    name: Truncates long strings with ellipsis
    given: A multi-line text string with excessive whitespace exceeding 140 characters
    when: oneLine is called with the string
    then: Collapses whitespace and returns a string at most 140 characters long ending in '…'
    expect:
      mode: manual
    derived: true
  - id: ex_0b067d
    name: Builds behavior rewrite prompt
    given: A target LenzNode, anchored symbol sources, and a parent node
    when: behaviorPrompt is called
    then: Returns a prompt showing the previous YAML description and anchored code, instructing the LLM
      to output JSON conforming to BEHAVIOR_SCHEMA
    expect:
      mode: manual
    derived: true
  - id: ex_730c75
    name: Builds node orientation summary prompt
    given: A LenzNode, incoming/outgoing dependency links, and child nodes
    when: summaryPrompt is called
    then: Returns a prompt asking for 2-4 sentences of plain prose referencing other nodes using
      bracketed IDs like [[n_id]]
    expect:
      mode: manual
    derived: true
derived: true
