kind: behavior
title: Parsing Claude stream JSON events
spec: Parses single newline-delimited stream JSON output lines into ParsedEvent objects. Discards
  non-JSON or invalid lines by returning null. Extracts session_id, concatenates text fragments from
  assistant messages, captures tool_use names and inputs, and structures final result messages with
  text, structured_output, cost, and error flags.
parent: n_80e676
status: proposed
examples:
  - id: ex_676b7a
    name: Parsing assistant text and tool call
    given: A JSON line
      '{"type":"assistant","session_id":"s1","message":{"content":[{"type":"text","text":"Hello
      "},{"type":"text","text":"world"},{"type":"tool_use","name":"Read","input":{"path":"foo.ts"}}]}}'
    when: parseStreamJsonLine is called with the line
    then: "It returns a ParsedEvent with session_id 's1', text 'Hello world', and tool { name: 'Read',
      input: { path: 'foo.ts' } }"
    expect:
      mode: manual
    derived: true
  - id: ex_2b6f7e
    name: Parsing execution result event
    given: A JSON line
      '{"type":"result","result":"Done","total_cost_usd":0.05,"is_error":false,"subtype":"success"}'
    when: parseStreamJsonLine is called with the line
    then: "It returns a ParsedEvent with result { text: 'Done', structured: undefined, cost: 0.05,
      is_error: false, subtype: 'success' }"
    expect:
      mode: manual
    derived: true
derived: true
