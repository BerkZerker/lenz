summary: This behavior oversees the queueing, concurrency limits, execution lifecycles, and
  transcript capture for external CLI agents as well as lightweight direct LLM calls. When
  orchestrating agent subprocesses, it delegates command preparation to [[n_c97bb7]], generates hook
  configurations with [[n_b83556]], and parses streaming output via [[n_33a1ff]]. For direct model
  invocations, it hands off generation requests to [[n_057f84]] or [[n_d27820]].
