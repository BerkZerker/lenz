kind: behavior
title: Run Lifecycle, Concurrency, and Execution Management
spec: RunManager coordinates the queueing, concurrency limits, execution, timeouts, cancellation,
  transcript recording, and changed-symbol attribution for both external CLI agent runs and light
  in-process LLM calls. Heavy agent runs and light LLM calls have independent concurrency limits.
  Agent runs write prompt and settings files, spawn CLI subprocesses, parse streaming JSON lines
  into summarized bus events and disk logs (`events.jsonl`), capture stderr, and release acquired
  locks on exit. Light runs invoke Gemini or OpenAI-compatible APIs directly with structured schema
  support. Active build runs track symbol changes across project files from structure index events.
parent: n_80e676
status: proposed
examples:
  - id: ex_446d7d
    name: Submit and execute an agent run
    given: A RunManager instance initialized with an agent adapter, a runs directory, and max concurrent
      runs greater than active runs.
    when: submit() is called with a build RunSpec containing a prompt and node ID.
    then: "A run ID is generated, the run record is queued, pumped, and started: a run directory with
      prompt.md, settings.json, and meta.json is created, a subprocess is spawned with timeout
      monitoring, stdout events are appended to events.jsonl and published on the event bus, and
      upon exit, locks are released, result.json is written, and the returned promise resolves with
      the run outcome."
    expect:
      mode: manual
    derived: true
  - id: ex_70f6f6
    name: Execute a light structured LLM run
    given: A RunManager configured with a non-Claude LLM provider (Gemini or OpenAI-compatible) and
      available LLM concurrency slots.
    when: "submit() is called with a RunSpec having light: true and a JSON schema."
    then: The run is started in-process via callLlm, abort controller and timeouts are configured,
      tokens and structured output are captured into the run record and result.json, and the outcome
      promise resolves.
    expect:
      mode: manual
    derived: true
  - id: ex_d0618f
    name: Kill a running or queued run
    given: A RunManager with an active spawned run process or a queued run waiting for a concurrency slot.
    when: kill(runId, reason) is called.
    then: If active, the process is killed, abort signal triggered, timer cleared, and status set to
      killed or timeout; if queued, it is removed from the queue and resolved immediately with
      status killed.
    expect:
      mode: manual
    derived: true
derived: true
