summary: This behavior automatically reconstructs structured intent and behavior hierarchies by
  analyzing unowned symbols and call relationships across an existing codebase. Triggered via API
  requests in [[n_c04098]] as well as workflows in [[n_5ffc74]] and [[n_dbc58c]], it inspects code
  structure and orphan symbols using [[n_1cef8b]], [[n_58299f]], [[n_5608cc]], and [[n_d12a81]]. It
  drives parallel generation runs through [[n_80e676]] while logging and publishing progress via
  [[n_77901c]] and [[n_c4686d]]. Finally, resulting nodes and anchors are resolved, formatted, and
  committed to domain storage via [[n_08fed0]], [[n_fb7815]], [[n_5ffc74]], [[n_19fac0]],
  [[n_c26d86]], and [[n_348046]], before handing off to [[n_dbc58c]] for summary generation.
