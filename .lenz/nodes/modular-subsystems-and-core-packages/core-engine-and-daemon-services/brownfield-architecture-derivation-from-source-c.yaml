kind: behavior
title: Brownfield Architecture Derivation from Source Code
spec: Derives intent and behavior nodes from unowned codebase symbols. Groups symbols into buckets
  using caller/callee proximity, submits parallel derivation runs, assigns call-based sibling
  dependencies, collapses redundant single-child container intents, prunes empty intents, and
  manages derivation reset policies and progress reporting.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_a97176
    name: assignSymbols groups symbols and sweeps unassigned helpers
    given: A list of symbols in a file and LLM group definitions omitting some helper symbols.
    when: assignSymbols(syms, groups, db, file) is executed.
    then: Unassigned symbols are swept into the bucket with the most caller/callee references.
    expect:
      mode: manual
    derived: true
  - id: ex_4bcbe3
    name: deriveAll starts brownfield derivation job
    given: An indexed project with unowned source files.
    when: deriveAll('proposed') is invoked.
    then: Derivation begins, publishing progress events, and resolves with created proposed intent and
      behavior nodes.
    expect:
      mode: manual
    derived: true
derived: true
