kind: behavior
title: Build Dispatch, Execution, and Multi-phase Verification
spec: Dispatches behavior build runs to LLM runners. Upon completion, auto-adopts newly created
  unowned symbols as anchors, executes test examples and machine check commands, triggers blind
  reconstruction and spec comparison, and supports anchor reassignment and manual example mark
  updates.
