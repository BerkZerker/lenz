summary: This behavior intercepts Claude Code lifecycle hook events to extract target write file
  paths from tool inputs and Bash commands, resolving lock permissions against the daemon broker. It
  is invoked during CLI execution by [[n_836db2]] and in turn hands off flag-level and API routing
  tasks back to [[n_836db2]].
