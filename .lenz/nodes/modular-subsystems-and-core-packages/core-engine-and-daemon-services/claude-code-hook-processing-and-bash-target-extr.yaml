kind: behavior
title: Claude Code Hook Processing and Bash Target Extraction
spec: Extracts candidate write file paths from Bash command strings containing write indicators or
  direct file tool inputs, and processes Claude Code hook events (`pre`, `post`, `notices`) by
  querying the Lenz daemon lock broker to acquire, refresh, or notify file locks and output
  permission decisions.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_493954
    name: Bash write target extraction
    given: A bash command string containing a redirection or file modification indicator such as `tee
      output.ts`
    when: "`bashWriteTargets` is called with the command and working directory"
    then: Returns an array containing the absolute path of `output.ts` if it or its parent directory
      exists on disk
    expect:
      mode: manual
    derived: true
  - id: ex_383327
    name: Pre-tool hook lock acquisition denied
    given: A pre-tool hook event with tool input targeting an in-repo file locked by another run
    when: "`hook('pre')` is invoked"
    then: Outputs JSON with permission decision 'deny' and the reason returned by the daemon lock API
    expect:
      mode: manual
    derived: true
derived: true
