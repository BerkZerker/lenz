kind: behavior
title: CLI Argument Parsing and Command Dispatch
spec: Parses CLI arguments, boolean flags, and valued flags; searches upward from the working
  directory or specified root to find a directory containing `.lenz`; configures daemon
  communication over HTTP; and dispatches subcommands (such as `init`, `start`, `index`,
  `summarize`, `status`, and `propose`) to local handlers or daemon API endpoints.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_7fc64f
    name: Project initialization
    given: A project root directory without `.lenz` metadata
    when: "`lenz init` is invoked"
    then: Initializes the `.lenz` directory at the resolved root and logs the relative path of the
      initialized directory
    expect:
      mode: manual
    derived: true
  - id: ex_497114
    name: Daemon status query
    given: A running lenz daemon listening on the configured port
    when: "`lenz status` is executed"
    then: Fetches status information from `/api/status` and prints the formatted JSON response
    expect:
      mode: manual
    derived: true
derived: true
