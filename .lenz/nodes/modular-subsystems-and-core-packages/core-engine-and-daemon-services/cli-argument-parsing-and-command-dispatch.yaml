summary: This node serves as the command-line interface entry point, handling flag parsing,
  workspace root discovery, and daemon communication setup. It loads initial settings through
  [[n_81d7fd]] before dispatching requested subcommands to components such as [[n_19d7fc]],
  [[n_77901c]], [[n_c04098]], [[n_9828f9]], [[n_d12a81]], [[n_298de6]], or [[n_58299f]]. In
  addition, it integrates with [[n_8e024e]] to handle custom hook processing and command targeting.
