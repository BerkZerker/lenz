summary: This node keeps project graph nodes synchronized with source code symbols by resolving
  anchor locations, silently updating shifted metadata, and flagging out-of-build code changes as
  drift. Triggered during system lifecycle flows in [[n_77901c]] and exposed to API clients via
  [[n_c04098]], it coordinates anchor lookups using [[n_08fed0]], [[n_58299f]], and [[n_fb7815]]
  while checking active execution states in [[n_80e676]]. It leverages data models from [[n_19fac0]]
  and [[n_5608cc]] to emit status changes through [[n_c4686d]], persist updated nodes via
  [[n_c26d86]], or dispatch rebuilds through [[n_484bc9]].
