kind: behavior
title: Code Anchor Resolution and Drift Detection
spec: Resolves node anchors against the structure database. Silently updates anchor metadata when
  symbols move or get renamed. Flags behavior nodes as drifted when anchored symbols are changed or
  deleted outside an active build, and provides resolution to either accept new code as verified
  anchors or redispatch the node for rebuilding.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_6e2f68
    name: detectDrift flags node when symbol changes
    given: A verified behavior node anchored to a symbol in a source file.
    when: A symbols_changed event occurs indicating modifications in that source file.
    then: The node status is updated to 'drifted' with drift reasons recorded, and drift.detected is
      published.
    expect:
      mode: manual
    derived: true
  - id: ex_8d9d62
    name: resolveDrift with holds accepts new code
    given: A drifted node whose source code was modified.
    when: resolveDrift(id, 'holds') is invoked.
    then: The node anchors are updated to current symbol definitions and its status is restored to its
      previous status.
    expect:
      mode: manual
    derived: true
derived: true
