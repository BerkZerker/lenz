summary: This node provides structure inspection, orphan symbol detection, and call-graph flow
  tracing across the codebase's architectural hierarchy. To locate unowned symbols, inspect file
  trees, and generate execution traces, it queries structural data and index synchronization through
  [[n_58299f]] and [[n_d12a81]], encodes symbol rows via [[n_5608cc]], navigates node hierarchies
  using [[n_c26d86]], and produces call trees with [[n_7671f2]]. Its flows and ownership queries are
  consumed by architecture derivation workflows in [[n_b3b72e]], lifecycle status routines in
  [[n_77901c]], and client-facing endpoints in [[n_c04098]].
