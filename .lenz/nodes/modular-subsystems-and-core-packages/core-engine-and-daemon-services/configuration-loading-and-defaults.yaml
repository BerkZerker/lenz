kind: behavior
title: Configuration loading and defaults
spec: Defines configuration schemas (LenzConfig, LlmConfig) and default settings (DEFAULT_CONFIG).
  Resolves the .lenz directory path for a project root and loads configuration from
  .lenz/config.yaml using loadConfig, falling back to default values and deeply merging the nested
  llm configuration with defaults when overrides are present.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_ae0548
    name: Load default configuration when config file does not exist
    given: A project root directory without a .lenz/config.yaml file
    when: loadConfig is invoked for the root directory
    then: It returns a copy of DEFAULT_CONFIG with default concurrency limits, timeouts, port, and LLM
      configuration
    expect:
      mode: manual
    derived: true
  - id: ex_379a88
    name: Load configuration with partial user overrides
    given: A project root directory containing .lenz/config.yaml with custom port and llm settings
    when: loadConfig is invoked for the root directory
    then: It returns DEFAULT_CONFIG merged with the YAML properties, preserving unmentioned default
      values and merging the nested llm configuration
    expect:
      mode: manual
    derived: true
derived: true
