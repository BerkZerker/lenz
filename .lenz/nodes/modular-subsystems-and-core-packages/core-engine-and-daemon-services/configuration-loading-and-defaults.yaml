summary: This node establishes project configuration schemas and default settings, resolving the
  `.lenz` workspace directory and loading `.lenz/config.yaml` while deeply merging user overrides
  with standard defaults. It supplies baseline structure settings to [[n_d12a81]]. In turn, its
  configuration loaders and directory resolvers are called during workspace initialization in
  [[n_19d7fc]], CLI command dispatch in [[n_836db2]], core system lifecycle management in
  [[n_77901c]], and agent run orchestration in [[n_80e676]].
