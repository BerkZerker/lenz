summary: This node defines the core domain models, schemas, and constants that standardize node
  definitions, execution run records, verification outcomes, and concurrency locks across the
  platform. It provides structural definitions that map directly to symbol anchor models in
  [[n_5608cc]]. These foundational types are consumed throughout the system, supporting node
  authoring, storage, and relationship summaries in [[n_348046]], [[n_c26d86]], and [[n_dbc58c]],
  architecture derivation and materialization in [[n_b3b72e]] and [[n_5ffc74]], anchor resolution
  and multi-phase verification in [[n_c8c898]], [[n_484bc9]], and [[n_9828f9]], as well as agent
  orchestration in [[n_80e676]] and lock management in [[n_6a10f1]].
