kind: behavior
title: Core Lenz domain models and schemas
spec: Declares data types, interfaces, and constants for Lenz nodes (node kinds, statuses,
  specification details, verification results, example definitions and outcomes, proposed anchors,
  and the EDITABLE_FIELDS whitelist for client PUT updates), execution run tracking (run kinds, run
  statuses, and execution metadata records), and file concurrency locks with audit events.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_bb5ee1
    name: Client-editable field whitelist
    given: A client requests a PUT mutation on a node
    when: Checking permitted fields against EDITABLE_FIELDS
    then: Only 'title', 'spec', 'examples', 'deps', 'machine', 'parent', and 'kind' are recognized as
      client-modifiable.
    expect:
      mode: manual
    derived: true
  - id: ex_91a941
    name: Node definition and verification typing
    given: A LenzNode object instance representing an intent or behavior
    when: Populated with specification, example tests, and verification state
    then: It conforms to LenzNode with NodeKind, NodeStatus, Example expectations (such as ExpectMode),
      and Verification outcomes.
    expect:
      mode: manual
    derived: true
  - id: ex_1d6a8f
    name: Run execution and lock tracking
    given: A core task execution and concurrency management process
    when: Recording execution runs and file locks
    then: RunRecord captures the run lifecycle using RunKind and RunStatus, and Lock/LockEvent capture
      file lock acquisition, transfer, and release.
    expect:
      mode: manual
    derived: true
derived: true
