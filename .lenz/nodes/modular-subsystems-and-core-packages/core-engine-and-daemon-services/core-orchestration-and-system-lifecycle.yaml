kind: behavior
title: Core Orchestration and System Lifecycle
spec: Initializes and manages Lenz Core subsystems including the StructureIndex, NodeStore,
  LockBroker, and RunManager. Handles environment variable loading, LLM provider fallback logic,
  indexing startup with SCIP precise references, watch mode toggling, event logging, and status
  reporting covering active runs, locks, drift count, staging status, orphans, and derivation
  progress.
