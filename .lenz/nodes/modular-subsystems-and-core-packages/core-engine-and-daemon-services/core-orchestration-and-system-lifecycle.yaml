    given: A Lenz Core instance configured for a project root.
    when: start() is invoked and status() is queried.
    then: Structure index indexes all files, anchors are refreshed, and status reports counts of nodes,
      orphans, drifted nodes, and active runs.
    expect:
      mode: manual
    derived: true
