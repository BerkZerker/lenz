summary: This node serves as the central orchestration hub for Lenz Core, managing system lifecycle,
  environment setup, and aggregated status reporting across the entire workspace. It is invoked by
  command dispatch in [[n_836db2]] and the API server in [[n_c04098]], as well as by high-level
  workflows like [[n_484bc9]], [[n_5ffc74]], [[n_b3b72e]], and [[n_dbc58c]]. To initialize and
  monitor the project, it coordinates with [[n_81d7fd]], [[n_19d7fc]], [[n_ed9767]], and
  [[n_c4686d]], while delegating core indexing, persistence, lock brokerages, and analysis tasks to
  [[n_c26d86]], [[n_d12a81]], [[n_6a10f1]], [[n_80e676]], [[n_ab4a86]], [[n_5608cc]], [[n_c8c898]],
  [[n_298de6]], [[n_759ab4]], [[n_58299f]], [[n_20e5ea]], and [[n_1cef8b]].
