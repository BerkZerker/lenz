kind: behavior
title: Example execution and expectation verification
spec: Executes shell commands for verification examples in a specified working directory with
  configurable timeouts. Evaluates process output (exit code, stdout, stderr, or timeout state)
  against configured expectation modes (`exit0`, `stdout_equals`, `stdout_contains`, `json_subset`,
  or `manual`), performs recursive JSON subset matching, truncates actual output exceeding 6000
  characters, and produces structured `ExampleResult` records.
