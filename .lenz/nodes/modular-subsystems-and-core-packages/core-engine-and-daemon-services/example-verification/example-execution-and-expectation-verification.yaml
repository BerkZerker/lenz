examples:
  - id: ex_000353
    name: Successful exit0 check
    given: An example with run command 'echo hello' and default 'exit0' expect mode
    when: runExamples is executed against the example
    then: "The command runs via bash -lc, returns exit code 0, and produces an ExampleResult with pass:
      true and captured stdout"
    expect:
      mode: manual
    derived: true
  - id: ex_1a1b8b
    name: JSON subset expectation verification
    given: "An example expecting json_subset with `{ status: 'ok' }` and a command outputting `{ status:
      'ok', count: 5 }`"
    when: judge evaluates the command output
    then: "isSubset verifies the nested structure and returns pass: true"
    expect:
      mode: manual
    derived: true
  - id: ex_053ee5
    name: Timed out command or missing run command
    given: An example with no run command or one that exceeds timeoutSec
    when: runExamples executes the example
    then: "The result records pass: false (or null if manual mode) with a corresponding note ('no run
      command' or 'timed out')"
    expect:
      mode: manual
    derived: true
derived: true
