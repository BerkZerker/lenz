summary: This behavior executes shell commands for verification examples within a specified working
  directory and validates process outcomes against configured expectation modes such as exit codes,
  stdout matching, and recursive JSON subsets. It manages execution timeouts, truncates oversized
  command outputs, and compiles the final evaluation into structured result records. Currently, this
  component operates as a self-contained verification routine with no direct dependencies or
  downstream handoffs linked.
