summary: This node manages file-level concurrency across runs by handling lock acquisitions, idle
  cooldown transfers, and notice delivery for preempted holders. It is utilized by [[n_77901c]],
  [[n_80e676]], and [[n_c04098]] to manage resource ownership and cleanup throughout agent
  lifecycles and external requests. In doing so, it structures its records with domain schemas from
  [[n_19fac0]] and broadcasts lock transition events via [[n_c4686d]].
