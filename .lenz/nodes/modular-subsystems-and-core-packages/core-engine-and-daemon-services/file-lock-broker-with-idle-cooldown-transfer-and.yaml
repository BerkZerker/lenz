kind: behavior
title: File lock broker with idle cooldown transfer and notices
spec: "LockBroker manages file-level locks across different execution runs. When a run acquires a
  lock, it is granted if the file is unheld or already held by the same run. If held by another run,
  LockBroker checks the holder's idle time against the cooldown duration: if within the cooldown
  period, acquisition is denied; if idle exceeds cooldown, the lock is transferred to the new run
  and an informative notice (optionally listing changed symbols) is queued for the former holder.
  Runs retrieve queued notices upon acquiring or taking notices. Active holders can refresh lock
  timestamps via `touch`, release specific files, or release all held locks at once. Lock state
  transitions (grant, deny, transfer, release, expire) are logged up to a 1,000-event buffer and
  broadcasted via the event bus as `lock.changed` events."
parent: n_0e8e26
status: proposed
examples:
  - id: ex_fbeeb6
    name: Acquire unheld lock
    given: A LockBroker with no existing locks on 'src/main.ts'
    when: Run 'run-1' calls `acquire('src/main.ts', 'run-1')`
    then: "Returns `{ granted: true, notices: [] }`, sets 'run-1' as the holder, and records a 'grant'
      event."
    expect:
      mode: manual
    derived: true
  - id: ex_ec48ed
    name: Deny lock acquisition within cooldown
    given: A LockBroker where 'src/main.ts' is held by 'run-1' with a recent write and a 30-second
      cooldown
    when: Run 'run-2' attempts to acquire 'src/main.ts' 5 seconds after 'run-1' touched it
    then: "Returns `{ granted: false, reason: 'src/main.ts is held by run run-1, active 5s ago; retry
      later or work elsewhere', notices: [] }` and logs a 'deny' event."
    expect:
      mode: manual
    derived: true
  - id: ex_3ddc8d
    name: Transfer idle lock and notify previous holder
    given: A LockBroker where 'src/main.ts' is held by 'run-1' but idle for longer than the cooldown
      duration
    when: Run 'run-2' acquires 'src/main.ts'
    then: "Returns `{ granted: true, transferred_from: 'run-1', notices: [] }`, updates the lock holder
      to 'run-2', logs a 'transfer' event, and queues a takeover notice for 'run-1'."
    expect:
      mode: manual
    derived: true
derived: true
