summary: This node serves as the primary communication boundary for Lenz Core, exposing a REST API,
  WebSocket event stream, and static GUI server for client interactions. Invoked by [[n_836db2]], it
  bridges incoming requests to core lifecycle controls in [[n_77901c]], node storage and authoring
  workflows in [[n_c26d86]] and [[n_348046]], and agent execution or verification pipelines in
  [[n_80e676]], [[n_484bc9]], and [[n_c8c898]]. Additionally, it coordinates structural querying and
  indexing with [[n_dbc58c]], [[n_1cef8b]], [[n_58299f]], [[n_d12a81]], and [[n_298de6]], while
  delegating staging, locking, and architectural derivation tasks to [[n_6a10f1]], [[n_20e5ea]],
  [[n_5ffc74]], and [[n_b3b72e]].
