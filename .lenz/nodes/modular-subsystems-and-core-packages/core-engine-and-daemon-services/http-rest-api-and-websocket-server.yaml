kind: behavior
title: HTTP REST API and WebSocket Server
spec: Starts and manages the HTTP and WebSocket server for Lenz Core. Registers route handlers for
  status, node operations (CRUD, approve, reject, dispatch, verify, reconstruct, drift resolution,
  example marking, anchor assignment), and system runs. Formats JSON responses and errors with
  permissive CORS headers. Handles WebSocket upgrades at `/events`, registering connections to
  broadcast core events and sending an initial hello message with core status upon opening. Serves
  static GUI files from the configured directory with cache-control headers, falling back to
  `index.html` for single-page application routes.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_1d51ac
    name: Handle REST API requests
    given: A running server initialized with startServer(core, staticDir)
    when: A GET request is sent to `/api/status`
    then: The server responds with HTTP 200, JSON content-type, CORS allow-origin headers, and the JSON
      payload returned by core.status().
    expect:
      mode: manual
    derived: true
  - id: ex_67b2f6
    name: Establish WebSocket connection on /events
    given: A client connecting to the `/events` endpoint
    when: The WebSocket handshake completes and the connection opens
    then: The socket is tracked in the active connection set and receives a JSON message of type 'hello'
      with the current timestamp and core status.
    expect:
      mode: manual
    derived: true
  - id: ex_980098
    name: Serve static GUI files and SPA fallback
    given: A static GUI directory containing an index.html file
    when: A GET request is received for a non-existent non-API path such as `/dashboard`
    then: "The server serves index.html with a 'cache-control: no-store' header."
    expect:
      mode: manual
    derived: true
derived: true
