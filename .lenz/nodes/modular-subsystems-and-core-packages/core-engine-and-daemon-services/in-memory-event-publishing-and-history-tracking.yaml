kind: behavior
title: In-memory event publishing and history tracking
spec: EventBus extends EventEmitter to manage application events defined by LenzEvent and EventName.
  When `publish(type, data)` is called, it constructs a LenzEvent record with the specified event
  `type`, the current UTC ISO timestamp string `at`, and the payload `data`. The event is appended
  to `history`. If `history` length exceeds 2000 entries, the oldest 500 entries are removed.
  Finally, EventBus emits both the generic 'event' event and the specific event named by `type`,
  passing the constructed LenzEvent object to registered listeners.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_84f6bc
    name: Publishing an event adds to history and notifies listeners
    given: An instance of EventBus with listeners registered for 'event' and 'node.updated'
    when: "publish('node.updated', { id: 'abc' }) is called"
    then: "A LenzEvent containing the type, an ISO timestamp, and { id: 'abc' } is appended to history,
      and both listeners receive the event object"
    expect:
      mode: manual
    derived: true
  - id: ex_2eaac2
    name: History trimming at capacity limit
    given: An EventBus with 2000 events already in history
    when: publish is called with a new event
    then: The new event is added, the length temporarily exceeds 2000, the oldest 500 items are spliced
      out, leaving 1501 items in history
    expect:
      mode: manual
    derived: true
derived: true
