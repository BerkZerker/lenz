kind: behavior
title: Gemini REST content generation
spec: Makes a direct REST POST request to Google Gemini's generateContent endpoint
  (`https://generativelanguage.googleapis.com/v1beta/models/${opts.model}:generateContent`) using
  the provided API key, prompt, and optional system instructions or JSON schema. Manages abort
  signals and request timeouts (defaulting to 180,000 ms). Returns a GeminiResult object containing
  generated text, parsed structured JSON (when schema is requested), token usage counts (prompt,
  output, thoughts), or error strings if the request fails, times out, is aborted, or returns an
  unparseable response / non-STOP finish reason.
parent: n_ed9767
status: proposed
examples:
  - id: ex_36da55
    name: structured generation with timeout handling
    given: A prompt, a JSON schema, an API key, and model 'gemini-1.5-flash'
    when: geminiGenerate is called with opts specifying prompt and schema
    then: It sends a POST request with responseMimeType 'application/json' and responseJsonSchema set,
      parses the returned text into structured data, and includes token usage metadata.
    expect:
      mode: manual
    derived: true
  - id: ex_e52e76
    name: network or request abortion
    given: An AbortSignal that fires or a request that exceeds timeoutMs
    when: geminiGenerate executes the fetch request
    then: "The request is aborted and returns `{ text: '', error: 'gemini: aborted' }`."
    expect:
      mode: manual
    derived: true
derived: true
