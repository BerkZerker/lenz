summary: This node manages direct REST communication with OpenAI-compatible `/chat/completions`
  endpoints to generate text or structured JSON outputs without external SDK dependencies. It
  formats prompt messages, applies optional response schemas, handles timeouts and abort signals,
  and returns completion results along with token usage metrics and error states. This completion
  behavior is invoked by [[n_ba9088]] whenever language model queries need to be executed.
