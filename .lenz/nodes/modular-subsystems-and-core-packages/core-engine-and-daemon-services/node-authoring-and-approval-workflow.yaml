kind: behavior
title: Node Authoring and Approval Workflow
spec: Provides CRUD operations, deep property mutation via nodeSet, and status transition workflows
  for nodes in the store. Automatically marks modified behavior nodes as staged. Allows approving
  proposed nodes to specified (along with descendants) or approving built/drifted nodes to verified,
  and supports rejecting nodes with notes while optionally redispatching a build.
parent: n_0e8e26
status: proposed
