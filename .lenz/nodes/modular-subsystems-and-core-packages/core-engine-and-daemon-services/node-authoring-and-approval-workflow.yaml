summary: This node manages node authoring lifecycles and approval workflows, handling CRUD
  operations, deep property mutations, and status transitions across proposed, specified, and
  verified states. It is triggered by interface requests through [[n_c04098]] and supports
  architecture derivation tasks from [[n_b3b72e]]. When modifying or reviewing nodes, it leverages
  domain models in [[n_19fac0]], persists updates via [[n_c26d86]], coordinates staging tracking in
  [[n_20e5ea]], broadcasts notifications through [[n_c4686d]], and can redispatch build pipelines
  using [[n_484bc9]].
