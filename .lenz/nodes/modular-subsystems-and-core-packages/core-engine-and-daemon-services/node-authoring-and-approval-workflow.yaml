    name: approve proposed intent promotes subtree
    given: A proposed intent node with proposed child behavior nodes.
    when: approve(id) is called on the intent node.
    then: The intent node and all its proposed descendants are updated to status 'specified'.
    expect:
      mode: manual
    derived: true
  - id: ex_1153ca
    name: putNode marks modified behavior as staged
    given: A verified behavior node in the store.
    when: putNode(id, patch) is called with a modified spec.
    then: The node is updated in the store with staged set to true and staging.changed is published.
    expect:
      mode: manual
    derived: true
derived: true
