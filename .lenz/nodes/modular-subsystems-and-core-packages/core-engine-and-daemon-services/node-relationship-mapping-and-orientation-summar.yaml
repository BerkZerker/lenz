  LLM-generated orientation summaries containing validated cross-node links. It is triggered by
  post-build hooks in [[n_484bc9]], architecture derivation and proposal flows in [[n_b3b72e]] and
  [[n_5ffc74]], or direct server requests via [[n_c04098]]. To complete these tasks, it delegates
  structural calculations to [[n_ab4a86]], accesses graph state through [[n_c26d86]] and
  [[n_19fac0]], and manages prompt runs and logging using [[n_80e676]], [[n_77901c]], and
  [[n_b3b72e]].
