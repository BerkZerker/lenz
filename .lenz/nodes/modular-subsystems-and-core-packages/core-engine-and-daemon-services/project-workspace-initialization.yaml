kind: behavior
title: Project workspace initialization
spec: Scaffolds a Lenz workspace under .lenz for a specified root directory using initProject.
  Creates subdirectories for nodes, agents, and runs. If not already present, writes default
  config.yaml (from DEFAULT_CONFIG), agents/claude.yaml (from DEFAULT_AGENT_YAML), .lenzignore at
  the project root, and .gitignore within the .lenz directory.
