kind: behavior
title: YAML-backed node storage and hierarchy management
spec: >-
  Provides NodeStore along with helper functions slugify and newId to manage Lenz nodes stored as
  YAML files under a directory hierarchy:

  - slugify(s) converts strings into lowercase alphanumeric slugs (replacing other characters with
  hyphens, trimming leading/trailing hyphens, capped at 48 characters, defaulting to 'node').

  - newId(prefix) generates random hex IDs prefixed with the given prefix (defaulting to 'n').

  - NodeStore maintains an in-memory mapping of node IDs and relative YAML paths, synchronizing with
  the file system, StructureDb, and EventBus.

  - load() recursively scans nodesDir for .yaml and .yml files, parses LenzNode definitions, clears
  existing anchors in StructureDb, and rebuilds the anchor mirror for all loaded nodes, logging
  parse errors as warnings on the event bus.

  - get(id), all(), children(parent), descendants(id), ancestors(id), and anchorsOf(id) provide
  lookup, parent-child navigation, ancestor/descendant traversal, and symbol anchor aggregation.

  - create(partial) generates a new node ID if omitted, defaults status to 'proposed' and spec to
  empty string, saves the node to disk, and mirrors anchors.

  - save(n, opts) computes the node's relative path from ancestor title slugs (disambiguating
  sibling collisions with ID suffixes), renames old files/directories if slugs changed, writes
  cleaned YAML to disk, updates StructureDb anchors, and publishes 'node.updated' unless silent.

  - update(id, patch) applies updates, verifies that reparenting does not place a node under its own
  descendant, and saves changes.

  - setStatus(id, status, extra) updates node status and extra properties.

  - delete(id, recursive) either deletes descendants recursively or reparents direct children,
  removes corresponding YAML files and directories, deletes anchors from StructureDb, cleans up
  references to the deleted ID across remaining node deps, and publishes 'node.deleted'.

  - topo(ids) topologically sorts nodes by dependency order breaking ties alphabetically by title.

  - tree() constructs a nested TreeItem representation of the entire node hierarchy.
parent: n_0e8e26
status: proposed
examples:
  - id: ex_5f87e9
    name: Create a behavior node
    given: A NodeStore instance configured with a target directory, a StructureDb, and an EventBus.
    when: "create({ kind: 'behavior', title: 'User Login', anchors: [{ file: 'auth.ts', symbol: 'login'
      }] }) is called."
    then: A node with a new ID is created, saved to 'user-login.yaml' under nodesDir, its anchors are
      mirrored to StructureDb, and a 'node.updated' event is published.
    expect:
      mode: manual
    derived: true
  - id: ex_01b451
    name: Navigate hierarchy and compute anchors
    given: A NodeStore containing an intent node with parent null and a child behavior node with anchors.
    when: anchorsOf is called with the intent node's ID.
    then: It returns the union of anchors from all descendant behavior nodes.
    expect:
      mode: manual
    derived: true
  - id: ex_d2278c
    name: Delete a node and clean up dependencies
    given: A NodeStore where node A lists node B in its deps array.
    when: delete('B') is executed.
    then: Node B's YAML file and anchors are removed, node A's deps array is updated to remove 'B', and
      a 'node.deleted' event is published.
    expect:
      mode: manual
    derived: true
derived: true
