summary: This module provides the core interactive visual components of the frontend, including the
  navigation explorer tree, node and source code detail inspectors, modal dialogs, and the status
  bar. Rendered directly by the top-level application shell in [[n_58c921]], it translates user
  actions into visual inspections and workflow triggers across the graph. It relies on [[n_a1505f]]
  for reactive state and [[n_b0a73c]] for data models, while dispatching queries through
  [[n_b8f010]], executing derivation actions via [[n_62ea90]], and applying visual styling cues
  using [[n_edf3ea]] and [[n_4a8975]].
