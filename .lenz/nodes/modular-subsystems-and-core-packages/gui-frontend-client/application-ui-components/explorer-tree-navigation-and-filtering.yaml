kind: behavior
title: Explorer Tree Navigation and Filtering
spec: "Renders the left explorer pane supporting dual tree modes: 'nodes' (intent and behavior node
  hierarchy) and 'files' (hierarchical directory structure constructed from flat FileEntry objects
  containing symbols). Provides search query filtering matching node titles, file paths, symbol
  names, and containers, alongside global expand-all and collapse-all controls and item selection
  handlers."
parent: n_eef5f8
status: proposed
examples:
  - id: ex_1f1967
    name: Build and display folder hierarchy in files mode
    given: A list of FileEntry objects with paths like 'src/components/Tree.tsx' and treeMode set to
      'files'
    when: The Tree component builds folders using buildFolders
    then: It constructs a nested Folder tree sorted alphabetically by name/path and renders folder and
      file rows.
    expect:
      mode: manual
    derived: true
  - id: ex_d35bd4
    name: Search filter matching
    given: A search query 'tree' and tree items or file entries
    when: The search filter predicates (hasMatch, symMatches, fileMatches, folderMatches) are evaluated
      against titles, paths, and symbols
    then: Items whose paths, node titles, symbol names, or symbol containers match the query in a
      case-insensitive manner are retained in the view.
    expect:
      mode: manual
    derived: true
  - id: ex_3334c8
    name: Expand and collapse all tree items
    given: The Tree pane rendered in either 'nodes' or 'files' mode
    when: The user clicks the expand all (⊞) or collapse all (⊟) toolbar button
    then: setExpanded is called with all node or folder/file path IDs on expand, or an empty array on
      collapse.
    expect:
      mode: manual
    derived: true
derived: true
