summary: This component manages the primary explorer navigation pane, rendering searchable and
  expandable tree views for both project nodes and file directory structures. It facilitates quick
  traversal by filtering paths, symbols, and titles while handling user selections. Tree item
  interactions hand off context to [[n_7d8829]] to drive detail views and visual status indicators.
