kind: behavior
title: Flow Hierarchy, Relations, and Entry Point Navigation
spec: Fetches and displays outgoing and incoming call flow trees, peer-level node call relations,
  and detected entry point symbols grouped by owning node or file. Uses useGoto to update store
  focus and selection when a linked node is clicked.
parent: n_eef5f8
status: proposed
examples:
  - id: ex_5b7cac
    name: display in and out flow trees
    given: FlowView fetches outgoing and incoming FlowStep objects for a node
    when: FlowView renders
    then: it renders 'flows into' and 'reached from' outline trees with step titles, via symbol hints,
      and click handlers to navigate to steps
    expect:
      mode: manual
    derived: true
  - id: ex_8acabb
    name: group entry points by node
    given: EntryPoints receives a list of entry point symbols where multiple symbols share the same
      owning node
    when: EntryPoints renders
    then: it renders a single row for the owning node listing joined entry symbol names and file paths
    expect:
      mode: manual
    derived: true
derived: true
