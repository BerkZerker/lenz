summary: This behavior facilitates code structure exploration by fetching and rendering incoming and
  outgoing call hierarchies, peer-level call relations, and entry point symbols grouped by file or
  node. When users click on any linked entity, it updates the application store's focus and
  selection states to enable seamless navigation across execution flows.
