summary: This behavior is responsible for rendering interactive modal dialog overlays across the
  application, supporting specialized dialog types such as shortcut help tables, confirmations,
  option pickers, and dynamic text or YAML editors. It coordinates user interaction by handling
  dismissals via overlay clicks or the Escape key and capturing submissions through action buttons
  or keyboard shortcuts. Operating directly against modal store state, it provides a centralized
  presentation and input layer for transient user workflows without direct downstream node handoffs.
