kind: behavior
title: Node Detail and Lifecycle Management
spec: Renders metadata, status, verification results, and drift details for the currently selected
  or focused node. Exposes tab navigation across spec, flow, examples, anchors, verify, and
  reconstruction views. Provides action buttons to approve, dispatch, summarize/re-summarize, or
  regenerate nodes according to their status and kind. When no node is selected, renders an empty
  state prompt and entry points.
