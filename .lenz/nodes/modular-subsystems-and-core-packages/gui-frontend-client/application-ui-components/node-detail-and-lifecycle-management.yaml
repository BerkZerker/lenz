summary: This behavior serves as the primary inspection and action panel for the active graph node,
  rendering its metadata, drift status, and tabbed subviews while exposing lifecycle controls such
  as approval, dispatch, and regeneration. When presenting node information, it hands off visual
  state indicators to [[n_7d8829]] and delegates the display of interactive linked overview text to
  [[n_a105ed]].
