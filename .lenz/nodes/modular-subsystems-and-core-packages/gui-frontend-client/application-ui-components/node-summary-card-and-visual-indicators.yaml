summary: This component provides reusable visual presentation elements, such as interactive node
  cards, status tags, and styled indicator dots, to represent node metadata, kinds, and lifecycle
  states throughout the interface. It serves as a visual building block relied on by [[n_729ebd]]
  for rendering tree indicators and by [[n_5d13e8]] for displaying node details and status badges.
