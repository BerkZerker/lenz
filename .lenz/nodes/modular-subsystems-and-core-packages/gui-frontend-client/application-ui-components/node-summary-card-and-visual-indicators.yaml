kind: behavior
title: Node summary card and visual indicators
spec: Renders visual indicators and card components for Lenz nodes. `StatusTag` displays a status
  badge with CSS class matching the status. `Dot` displays a styled colored dot reflecting the
  node's area color, kind (intent uses transparent background), proposed status (dashed border), and
  status ring box shadow. `NodeCard` renders an interactive card for a node displaying its title,
  `Dot`, `StatusTag`, spec text (or fallback '(no spec)'), kind, counts for examples/anchors when
  kind is 'behavior', and badges for staged, needs-reverify, derived, plus any extra child content.
