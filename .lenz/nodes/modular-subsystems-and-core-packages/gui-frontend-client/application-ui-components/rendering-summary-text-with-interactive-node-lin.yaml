summary: This behavior parses summary text to convert embedded node identifiers into interactive,
  styled links alongside standard text spans. Clicking a resolved reference navigates directly to
  that target by updating the application's active selection and focus states. It is utilized by
  [[n_5d13e8]] to present linked overview descriptions and detail views.
