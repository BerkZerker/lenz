kind: behavior
title: Source Code and Ownership Viewer
spec: Fetches and displays source code text and symbol metadata for a file, computes line-by-line
  ownership mapping from symbols to nodes, scrolls the selected symbol into view, indicates unowned
  symbols or files, and provides navigation to focus and select the owning node.
parent: n_eef5f8
status: proposed
examples:
  - id: ex_777fd2
    name: scroll to selected symbol and show owner button
    given: a file has loaded containing a symbol matching symKey with an assigned owner node ID
    when: CodeView mounts or updates
    then: the symbol's start line element is scrolled into view and a button to navigate to the owning
      node is rendered
    expect:
      mode: manual
    derived: true
  - id: ex_72024c
    name: show unowned tag for symbol without owner
    given: the loaded source contains the selected symKey with owner set to null
    when: CodeView renders
    then: a tag with class 'tag warn' displaying 'unowned' is shown in the detail bar
    expect:
      mode: manual
    derived: true
derived: true
