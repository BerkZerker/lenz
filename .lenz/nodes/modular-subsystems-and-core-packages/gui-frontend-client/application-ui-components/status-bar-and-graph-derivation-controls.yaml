summary: This node renders the application's primary status bar, providing real-time visibility into
  connection health, notification toasts, and key system metrics such as active runs, drifted nodes,
  and staged items. It also supplies interactive controls to trigger and monitor graph derivation
  progress as well as toggle immediate staging. It currently operates as a self-contained UI
  behavior with no explicitly recorded upstream callers or downstream handoffs.
