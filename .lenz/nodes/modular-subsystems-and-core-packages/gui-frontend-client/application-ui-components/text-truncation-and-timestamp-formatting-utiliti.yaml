kind: behavior
title: Text truncation and timestamp formatting utilities
spec: "`fmtTime` formats an ISO timestamp string into a localized time string using
  `Date.prototype.toLocaleTimeString`, returning an empty string if undefined. `short` truncates
  strings longer than `n` characters (default 80) to length `n - 1` appended with an ellipsis ('…'),
  returning shorter or equal length strings unchanged."
