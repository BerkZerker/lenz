kind: behavior
title: Area-based subtree color assignment
spec: Assigns deterministic palette colors to nodes based on their top-level root ancestor.
  Traverses node parent references via areaOf to locate the root area ID, sorts all root nodes
  alphabetically by title to find a stable index via areaIndex, and selects the corresponding color
  from PALETTE modulo its length in areaColor. If no area node is resolved, returns '#d4d4d4'.
parent: n_e265c6
status: proposed
examples:
  - id: ex_958051
    name: Resolve color for nested child node
    given: A node dictionary containing root node 'root1' with title 'Alpha' and child node 'child1'
      with parent 'root1'
    when: areaColor is called with node ID 'child1'
    then: It resolves 'root1', calculates index 0 among sorted root nodes, and returns '#60a5fa'
    expect:
      mode: manual
    derived: true
  - id: ex_55030b
    name: Fallback color for missing node
    given: An empty nodes dictionary and a null ID
    when: areaColor is called with null
    then: It returns '#d4d4d4'
    expect:
      mode: manual
    derived: true
derived: true
