kind: behavior
title: Client-side API request dispatching
spec: "Dispatches HTTP requests to `/api${path}` with a `content-type: application/json` header and
  optional JSON-stringified body. Defaults the HTTP method to `POST` when `body` is provided or
  `GET` when omitted, unless an explicit method is supplied (such as `DELETE` via `del`). Parses the
  response body as JSON (defaulting to `{}` on parse failure). If the response is not OK (`!r.ok`),
  throws an Error with `j.error` or `r.statusText`. Otherwise returns the parsed JSON object."
parent: n_e265c6
status: proposed
examples:
  - id: ex_7b7c78
    name: Successful GET request
    given: 'The API server endpoint `/api/items` responds with status 200 and JSON `[{"id": 1}]`'
    when: Calling `api("/items")`
    then: 'It sends a GET request to `/api/items` with JSON headers and resolves to `[{"id": 1}]`'
    expect:
      mode: manual
    derived: true
  - id: ex_ad9c25
    name: Failed request throwing an error
    given: 'The API server endpoint `/api/items` responds with status 400 and JSON `{"error": "Bad
      Request"}`'
    when: 'Calling `api("/items", { name: "invalid" })`'
    then: It sends a POST request with the serialized JSON payload and rejects with an Error message
      'Bad Request'
    expect:
      mode: manual
    derived: true
  - id: ex_8e27aa
    name: DELETE request via helper
    given: 'The API server endpoint `/api/items/1` responds with status 200 and JSON `{"deleted": true}`'
    when: Calling `del("/items/1")`
    then: "It executes an `api` call targeting `/api/items/1` with method 'DELETE' and resolves with
      `{\"deleted\": true}`"
    expect:
      mode: manual
    derived: true
derived: true
