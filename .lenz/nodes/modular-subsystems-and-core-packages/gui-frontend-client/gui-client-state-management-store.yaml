kind: behavior
title: GUI client state management store
spec: Maintains the reactive UI state and actions for the GUI, including node selections, tree
  hierarchy expansion, lens mode, modal dialogs, and toast notifications. Tracks and synchronizes
  node relations, runs, locks, and picked code files, ensuring selecting a node expands ancestor
  nodes via reveal() while clearing picked files (and vice-versa). Persists tree display mode to
  localStorage and connects to backend REST and WebSocket event endpoints.
parent: n_e265c6
status: proposed
examples:
  - id: ex_e190c2
    name: Selecting a node clears picked file and expands ancestors
    given: The store has a parent node 'pkg/a' and child 'pkg/a/fn', with a file currently picked in
      'picked'
    when: setSelected('pkg/a/fn') is executed
    then: selected is set to 'pkg/a/fn', picked is set to null, and 'pkg/a' is added to the expanded set
    expect:
      mode: manual
    derived: true
  - id: ex_ab417f
    name: Toggling node expansion in the tree
    given: The expanded set contains 'node-1'
    when: toggleExpanded('node-1') is called
    then: "'node-1' is removed from the expanded set"
    expect:
      mode: manual
    derived: true
  - id: ex_4aedc1
    name: Posting and auto-dismissing a toast notification
    given: The store has null toast
    when: notify('Changes saved') is called
    then: toast is set to 'Changes saved' and automatically reset to null after 3000ms if unchanged
    expect:
      mode: manual
    derived: true
derived: true
