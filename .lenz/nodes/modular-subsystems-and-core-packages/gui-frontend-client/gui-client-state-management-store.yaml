summary: This store manages reactive client-side state and actions for the GUI, synchronizing node
  selections, tree hierarchy expansion, modals, and file views. It structures its state using
  [[n_b0a73c]] and dispatches backend communication through [[n_b8f010]] to keep UI data
  synchronized with server events. It serves as the central state provider for [[n_eef5f8]] and the
  application shell in [[n_58c921]], while also initiating graph and node processing tasks via
  [[n_62ea90]].
