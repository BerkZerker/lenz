kind: behavior
title: GUI Data Model and State Types
spec: Defines core TypeScript data interfaces and types for the GUI client, encompassing intent and
  behavior nodes (LenzNode, TreeItem), code anchors and symbol indexing (Anchor, SymbolRow), example
  execution and verification results (Example, ExampleResult), run execution logs and file locking
  records (RunRecord, Lock, LockEvent), derivation tracking and options (DeriveProgress,
  DeriveReset), system overview metrics (Status), and navigation lens identifiers (Lens).
parent: n_e265c6
status: proposed
examples:
  - id: ex_496e59
    name: Node and verification representation
    given: A LenzNode instance containing code anchors and example assertions
    when: The node data structure is populated with status, verification metrics, and example results
    then: The structure complies with LenzNode, Anchor, Example, and ExampleResult type contracts.
    expect:
      mode: manual
    derived: true
  - id: ex_0b7efa
    name: GUI status and active lens view definition
    given: GUI state tracking current system metrics and active navigation view
    when: A Lens view ('graph', 'queue', 'verify', 'orphans', 'runs', 'flow', 'propose', 'stage') and a
      Status record are declared
    then: The Status type models run counts, locks, drifted nodes, staged items, and DeriveProgress
      state, while Lens restricts the view selection to allowed identifiers.
    expect:
      mode: manual
    derived: true
derived: true
