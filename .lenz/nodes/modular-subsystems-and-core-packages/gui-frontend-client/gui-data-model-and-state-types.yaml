summary: This node establishes the core TypeScript interfaces and type definitions used to represent
  GUI domain entities, including navigation nodes, derivation progress, execution records, and
  status metrics. It supplies the foundational data structures utilized by the client state store in
  [[n_a1505f]] and interface elements in [[n_eef5f8]]. Furthermore, its models back graph derivation
  workflows in [[n_62ea90]] and subtree color mapping logic in [[n_edf3ea]].
