summary: This node serves as the primary application shell, orchestrating the two-pane layout while
  managing global keyboard navigation, URL hash-based deep linking, and backend connectivity. It
  mounts the core interface elements provided by [[n_eef5f8]] and coordinates application state via
  [[n_a1505f]]. To execute user actions and updates, it dispatches requests through [[n_b8f010]] and
  initiates graph processing routines using [[n_62ea90]].
