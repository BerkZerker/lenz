summary: This behavior manages the initiation of graph and node derivation workflows, handling
  derivation state checks, user confirmation modals, and reset configuration options. It is invoked
  from the top-level interface in [[n_58c921]] and interactive components in [[n_eef5f8]]. In turn,
  it utilizes types from [[n_b0a73c]], updates notifications and client state via [[n_a1505f]], and
  dispatches derivation requests through [[n_b8f010]].
