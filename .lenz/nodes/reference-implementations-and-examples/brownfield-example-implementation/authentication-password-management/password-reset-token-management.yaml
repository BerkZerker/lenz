kind: behavior
title: Password reset token management
spec: Generates and stores temporary reset tokens associated with creation timestamps, dispatches
  them via a mailer, and allows consuming a stored token to hash a new password while removing the
  token, returning 410 if the token does not exist.
parent: n_db379b
status: proposed
examples:
  - id: ex_805f6e
    name: Requesting a password reset
    given: an email address and a mailer implementation
    when: requestReset is called with the email and mailer
    then: a random string token is stored in tokens with the current timestamp, sent through
      mailer.send, and returned
    expect:
      mode: manual
    derived: true
  - id: ex_f6ff81
    name: Consuming a valid password reset token
    given: a token exists in the tokens store
    when: consumeReset is called with the token and a new password
    then: the token is deleted from the tokens store and the hashed password is returned
    expect:
      mode: manual
    derived: true
  - id: ex_8175e1
    name: Consuming an invalid or non-existent reset token
    given: a token does not exist in the tokens store
    when: consumeReset is called with the token and a password
    then: it returns status code 410
    expect:
      mode: manual
    derived: true
derived: true
