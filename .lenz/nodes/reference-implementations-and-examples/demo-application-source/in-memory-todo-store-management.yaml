summary: This behavior provides in-memory state management for todo items, enabling the creation,
  deletion, completion, and filtered retrieval of tasks. It enforces data integrity by validating
  task titles, checking status filters, and guarding against operations on nonexistent IDs.
  Currently, it functions as a self-contained unit with no external dependencies or direct
  downstream handoffs.
