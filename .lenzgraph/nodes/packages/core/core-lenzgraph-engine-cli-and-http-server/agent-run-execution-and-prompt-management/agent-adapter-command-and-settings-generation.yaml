kind: behavior
title: Agent Adapter Command and Settings Generation
spec: Loads agent adapter configurations, parses command-line argument strings with quotes and
  escapes, generates execution commands with variable replacements, renders Claude settings for tool
  hook interception, and parses streamed agent event lines into structured event objects.
parent: n_000dd8
status: proposed
examples:
  - id: ex_2f352a
    name: Build command with substituted template variables
    given: An adapter with command template 'claude -p {prompt_file} -s {settings_file}' and variable
      mappings for prompt and settings files
    when: buildCommand is invoked with the adapter and variables
    then: Returns the command array with variables replaced by their actual file paths.
    expect:
      mode: exit0
    derived: true
  - id: ex_970127
    name: Parse streaming JSON line
    given: A single line of NDJSON output emitted from Claude containing an assistant message text block
    when: parseStreamJsonLine is called with the line
    then: Returns a ParsedEvent with the extracted text, session ID, or tool usage payload.
    expect:
      mode: exit0
    derived: true
derived: true
