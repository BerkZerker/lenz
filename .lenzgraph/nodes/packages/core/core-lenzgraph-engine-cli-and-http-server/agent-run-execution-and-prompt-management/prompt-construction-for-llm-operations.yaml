status: proposed
examples:
  - id: ex_10689e
    name: Generate build prompt for a node
    given: A node with spec and examples, alongside project context and structure index
    when: buildPrompt is invoked
    then: Returns a comprehensive prompt incorporating node spec, examples, conventions, lock
      instructions, and callee symbol definitions.
    expect:
      mode: exit0
    derived: true
  - id: ex_bc532e
    name: Generate derivation prompt for a folder
    given: A folder path, list of indexed symbols, and child folder intents
    when: derivePrompt is called
    then: Returns a prompt instructing the LLM to group symbols into 1-9 behavior nodes adhering to
      DERIVE_SCHEMA.
    expect:
      mode: exit0
    derived: true
derived: true
