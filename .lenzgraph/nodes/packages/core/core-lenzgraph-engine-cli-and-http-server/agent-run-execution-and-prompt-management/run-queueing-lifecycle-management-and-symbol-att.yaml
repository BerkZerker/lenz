kind: behavior
title: Run Queueing, Lifecycle Management, and Symbol Attribution
spec: Manages execution queues, process spawning, in-process Gemini invocations, timeouts, process
  termination, run status queries, and attributes symbol changes occurring during runs back to the
  responsible run records.
parent: n_000dd8
status: proposed
examples:
  - id: ex_a670b1
    name: Submit and execute run within concurrency limits
    given: A RunManager configured with max concurrency 2 and no active processes
    when: A new build RunSpec is submitted
    then: The run is started immediately, tracked in the active list, emits events to the event bus, and
      resolves a RunOutcome upon completion.
    expect:
      mode: exit0
    derived: true
  - id: ex_575b15
    name: Attribute symbol changes to active run
    given: A run holding lock on file 'foo.ts'
    when: SymbolsChanged event occurs with modified symbols for 'foo.ts'
    then: The modified symbols are recorded under the active run record's change list.
    expect:
      mode: exit0
    derived: true
derived: true
