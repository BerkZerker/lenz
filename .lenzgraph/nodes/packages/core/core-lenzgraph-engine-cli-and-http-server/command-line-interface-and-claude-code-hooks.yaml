kind: behavior
title: Command-Line Interface and Claude Code Hooks
spec: Parses CLI arguments and flags, dispatches commands to local daemon or starts background
  services (init, dev, status, dispatch, verify, flow, propose, derive, node commands), and provides
  Claude Code agent tool hooks for PreToolUse and PostToolUse lock management.
parent: n_87c287
status: proposed
examples:
  - id: ex_507240
    name: Extract target files from write bash command
    given: A command string 'echo hello > src/file.ts' and existing directory cwd
    when: bashWriteTargets(cmd, cwd) is invoked
    then: Returns ['src/file.ts'].
    expect:
      mode: exit0
    derived: true
  - id: ex_f8c5f9
    name: Execute CLI hook pre tool use
    given: Stdin with JSON payload containing run id and Write tool target file
    when: lenzgraph hook pre is executed
    then: Attempts to acquire lock for target file and returns decision object to stdout.
    expect:
      mode: exit0
    derived: true
derived: true
