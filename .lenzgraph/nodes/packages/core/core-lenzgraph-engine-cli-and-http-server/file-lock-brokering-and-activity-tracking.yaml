kind: behavior
title: File Lock Brokering and Activity Tracking
spec: Coordinates file concurrency among active runs by granting, denying, or transferring file
  locks based on write activity cooldown timeouts, tracks write touches, and queues advisory notices
  for runs.
parent: n_87c287
status: proposed
examples:
  - id: ex_5c751e
    name: Acquire an uncontested lock
    given: A LockBroker with no active locks for 'src/index.ts'
    when: acquire('src/index.ts', 'run_1') is called
    then: Lock is granted to 'run_1' and a grant event is recorded.
    expect:
      mode: exit0
    derived: true
  - id: ex_3f39a2
    name: Transfer stale lock after cooldown
    given: Lock for 'src/foo.ts' held by 'run_1' whose last write exceeds cooldown seconds
    when: acquire('src/foo.ts', 'run_2') is called
    then: Lock is transferred to 'run_2', transfer event is recorded, and notices are pushed to 'run_1'.
    expect:
      mode: exit0
    derived: true
derived: true
