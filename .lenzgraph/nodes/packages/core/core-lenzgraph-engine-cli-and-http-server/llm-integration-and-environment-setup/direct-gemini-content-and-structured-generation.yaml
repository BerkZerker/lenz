kind: behavior
title: Direct Gemini Content and Structured Generation
spec: Executes direct HTTP POST requests to the Gemini generateContent REST endpoint using an API
  key, model name, prompt, and optional system instructions or structured JSON schemas. Returns
  generated text, structured JSON outputs, usage token counts, or error messages upon timeout or
  network failure.
parent: n_0bc597
status: proposed
examples:
  - id: ex_2e6ae6
    name: Generate plain text content
    given: A valid Gemini API key and prompt text without a schema.
    when: Calling geminiGenerate with the API key, model name, and prompt.
    then: Returns a GeminiResult containing the model's text response and prompt/output token usage
      counts.
    expect:
      mode: exit0
    derived: true
  - id: ex_e25c3a
    name: Generate structured JSON data
    given: A valid Gemini API key, prompt, and a JSON schema specification.
    when: Calling geminiGenerate with schema options provided.
    then: Returns a GeminiResult with parsed JSON in the structured property adhering to the schema.
    expect:
      mode: exit0
    derived: true
derived: true
