kind: behavior
title: Environment Variable File Loader
spec: Reads specified file paths formatted with KEY=VALUE declarations and populates process.env
  with the parsed pairs without overwriting any environment variables that are already set.
parent: n_0bc597
status: proposed
examples:
  - id: ex_fd3a23
    name: Load unset environment variables
    given: An array of file paths containing GEMINI_API_KEY=xyz where GEMINI_API_KEY is not in
      process.env.
    when: Calling loadEnvFiles with the paths.
    then: Sets process.env.GEMINI_API_KEY to 'xyz'.
    expect:
      mode: exit0
    derived: true
  - id: ex_d9a998
    name: Preserve existing environment variables
    given: process.env.GEMINI_API_KEY is already set to 'existing_key' and an env file defines
      GEMINI_API_KEY='new_key'.
    when: Calling loadEnvFiles with the env file path.
    then: Keeps process.env.GEMINI_API_KEY as 'existing_key'.
    expect:
      mode: exit0
    derived: true
derived: true
