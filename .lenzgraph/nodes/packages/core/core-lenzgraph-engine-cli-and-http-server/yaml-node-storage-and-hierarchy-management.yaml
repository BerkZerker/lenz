kind: behavior
title: YAML Node Storage and Hierarchy Management
spec: Persists and loads intent and behavior nodes as YAML files structured by hierarchy paths,
  enforces a fan-out cap per parent node (max 9 children), mirrors node anchors into structure
  index, generates topological orderings, and produces tree views.
parent: n_87c287
status: proposed
examples:
  - id: ex_fd1273
    name: Create node and enforce fan-out limit
    given: A parent node that already has 9 child nodes
    when: Attempting to create a 10th child node under that parent
    then: A FanOutError is thrown.
    expect:
      mode: exit0
    derived: true
  - id: ex_167bfe
    name: Update node status and sync anchors
    given: An existing behavior node in NodeStore
    when: "update(id, { title: 'New Title' }) is called"
    then: The node YAML file is updated on disk, anchors are mirrored to structure DB, and
      'node.updated' is published.
    expect:
      mode: exit0
    derived: true
derived: true
