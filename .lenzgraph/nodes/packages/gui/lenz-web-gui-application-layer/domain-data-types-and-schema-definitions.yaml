summary: This node establishes the foundational TypeScript types and schemas that model domain
  entities such as nodes, symbols, execution records, and navigation modes. It serves as a shared
  structural contract consumed across the project, underpinning the application routing in
  [[n_639b5c]] and global state storage in [[n_4b092f]]. Its entity definitions are also actively
  referenced when rendering interface elements in [[n_9fe373]] and specialized views in
  [[n_742e8a]].
