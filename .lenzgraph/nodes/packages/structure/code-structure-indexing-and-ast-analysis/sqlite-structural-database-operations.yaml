kind: behavior
title: SQLite Structural Database Operations
spec: Manages the local SQLite database storing files, symbols, imports, cross-references,
  unresolved references, entry points, and anchor mappings, providing query and bulk replacement
  methods within transactions.
parent: n_424a45
status: proposed
examples:
  - id: ex_c25554
    name: Querying file symbols and anchors
    given: A StructureDb instance containing extracted symbols for 'src/index.ts'
    when: symbolsInFile('src/index.ts') and setAnchors('node-1', ['src/index.ts##function#main']) are
      executed
    then: The symbol rows are returned in line order and 'node-1' is recorded as the owner of main.
    expect:
      mode: exit0
    derived: true
derived: true
