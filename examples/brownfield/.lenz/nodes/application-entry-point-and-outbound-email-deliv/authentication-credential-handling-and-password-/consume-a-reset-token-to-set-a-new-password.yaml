kind: behavior
title: Consume a reset token to set a new password
spec: consumeReset completes a password reset. Given a token and a new password, it validates the
  token against the token store; if valid, it hashes the new password, applies it to the account,
  and invalidates the token so it cannot be reused. If the token is unknown, expired, or already
  used, the operation fails with a ResetError identifying the failure by code.
parent: n_7fb961
status: proposed
examples:
  - id: ex_63cfee
    name: valid token resets password
    given: a token previously issued by requestReset
    when: consumeReset(token, "newPw") is awaited
    then: the account's password is updated to the hashed value and the token is removed from the store
    expect:
      mode: exit0
    derived: true
  - id: ex_3e8ef3
    name: unknown token is rejected
    given: a token that was never issued or was already consumed
    when: consumeReset is awaited with it
    then: it rejects with a ResetError and no password is changed
    expect:
      mode: exit0
    derived: true
derived: true
