kind: behavior
title: Password hashing
spec: hashPassword transforms a plaintext password into the representation stored by the system.
  Given a plaintext string, it returns a deterministic derived string (currently the plaintext
  prefixed with "h:"), so equal passwords hash to equal values and the original is not stored
  verbatim.
