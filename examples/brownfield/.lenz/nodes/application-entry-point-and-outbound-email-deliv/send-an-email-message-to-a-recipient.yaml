kind: behavior
title: Send an email message to a recipient
spec: Mailer.send(to, body) delivers an outbound message addressed to the given recipient with the
  given body. In the current implementation delivery consists of writing the recipient address and
  body to standard output via console.log; no network mail transport is used and no value is
  returned.
parent: n_b60601
status: proposed
examples:
  - id: ex_ed294d
    name: Send logs recipient and body
    given: a Mailer instance
    when: send('alice@example.com', 'Reset your password') is called
    then: the line 'alice@example.com Reset your password' is written to standard output
    expect:
      mode: exit0
    derived: true
  - id: ex_2a384b
    name: Multiple sends are independent
    given: a Mailer instance
    when: send is called twice with different recipients
    then: each recipient and body pair is logged once, in call order
    expect:
      mode: exit0
    derived: true
derived: true
