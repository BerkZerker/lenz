kind: intent
title: Authentication credential handling and password reset
spec: "The src/auth folder owns the credential side of authentication: it hashes passwords into a
  stored representation and implements a token-based password reset flow. A reset is requested by
  email, producing a token that is delivered via an injected Mailer and recorded in an in-memory
  token store; the token is later consumed together with a new password to complete the reset.
  Failures in the reset flow are reported through a dedicated ResetError type carrying a
  machine-readable code and a human-readable description. The folder has no subfolders."
