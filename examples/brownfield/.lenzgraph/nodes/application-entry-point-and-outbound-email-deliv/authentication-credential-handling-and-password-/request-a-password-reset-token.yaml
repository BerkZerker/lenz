kind: behavior
title: Request a password reset token
spec: requestReset starts a password reset for an email address. It generates a reset token, records
  it in the in-memory token store (the `tokens` map, keyed by token with an associated numeric value
  such as an expiry or user reference), sends the token to the address via the supplied Mailer, and
  returns the token to the caller.
parent: n_7fb961
status: proposed
examples:
  - id: ex_93a91a
    name: issues and mails a token
    given: a user email and a Mailer
    when: requestReset(email, mailer) is called
    then: a token string is returned, the token is present in the tokens store, and the mailer was
      invoked to deliver it to the email
    expect:
      mode: exit0
    derived: true
