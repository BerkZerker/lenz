kind: behavior
title: Add todo with title validation
spec: 'Extend `add(title: string): Todo` on the store. Input: a title string. If the title is empty
  or consists only of whitespace (per `String.prototype.trim()`), throw an `Error` with message
  `"title is required"` and do not mutate the store. Otherwise create `{ id, title, done: false }`
  where `id` is the next sequential integer (starting at 1), append it to the store, and return the
  new todo. The title is stored exactly as given (not trimmed).'
parent: n_9f47be
status: built
examples:
  - id: ex_684af7
    name: adds a todo
    given: an empty store
    when: add("buy milk") is called
    then: 'it returns { id: 1, title: "buy milk", done: false } and list() contains that todo'
    expect:
      mode: exit0
    run: bun test tests/add.test.ts -t ex_684af7
  - id: ex_143fbd
    name: rejects empty title
    given: an empty store
    when: add("") is called
    then: it throws Error("title is required") and list() is still empty
    expect:
      mode: exit0
    run: bun test tests/add.test.ts -t ex_143fbd
  - id: ex_31c1fb
    name: rejects whitespace-only title
    given: an empty store
    when: add("   ") is called
    then: it throws Error("title is required") and list() is still empty
    expect:
      mode: exit0
    run: bun test tests/add.test.ts -t ex_31c1fb
  - id: ex_ca5516
    name: ids increment
    given: a store where add("a") returned id 1
    when: add("b") is called
    then: it returns a todo with id 2
    expect:
      mode: exit0
    run: bun test tests/add.test.ts -t ex_ca5516
