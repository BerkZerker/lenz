reconstruction: >-
  `createStore()` builds an in-memory to-do store and returns an object with three operations. State
  lives in two closure variables: a `todos` array and a counter `next` starting at 1. Nothing is
  persisted; each call to `createStore()` yields an independent store with its own list and counter.


  **`list()`** returns a shallow copy of the array. Callers can reorder or truncate the returned
  array without affecting the store, but the `Todo` objects inside are the same references held by
  the store, so mutating a returned todo's fields (e.g. setting `done = true`) does change the
  store's data. Items are returned in insertion order.


  **`add(title)`** creates and returns a new todo. It first rejects titles that are empty or consist
  only of whitespace by throwing `Error("title is required")`; no todo is created and the id counter
  does not advance. Otherwise it stores the title *exactly as given* (leading/trailing whitespace is
  preserved, not trimmed), assigns `id` from the counter and then increments the counter, and sets
  `done: false`. The returned object is the same reference stored internally. Ids are therefore
  strictly increasing positive integers, unique for the store's lifetime, and never reused after
  removal. Duplicate titles are allowed. A non-string `title` is not guarded against; calling
  `.trim()` on a non-string would throw a TypeError.


  **`remove(id)`** deletes the first todo whose `id` strictly equals the argument. If none matches,
  it throws `Error("todo not found: <id>")` and leaves the store unchanged. On success it removes
  that one element in place and returns nothing. Because ids are unique, at most one item is ever
  removed.


  There is no way to update a todo through the API (no toggle/edit method), no way to look up a
  single item by id, and no way to clear the store other than removing items one by one. The store
  is not thread-safe or concurrency-aware in any special sense; it is plain synchronous JavaScript.
