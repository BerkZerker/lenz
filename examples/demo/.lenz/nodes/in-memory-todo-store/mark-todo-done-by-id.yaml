reconstruction: >-
  ### Method Behavior: `createStore.done`


  **Overview**

  The `done` method marks a single to-do item within the store's `todos` collection as completed by
  its unique identifier.


  ---


  ### Inputs and Outputs

  * **Input:** `id` (number) — The identifier of the to-do item to mark as done.

  * **Output:** `Todo` — The updated to-do item object.


  ---


  ### Execution Flow

  1. **Search:** Scans the `todos` collection sequentially for the first item whose `id` strictly
  equals the provided `id`.

  2. **Validation:** Checks if a matching item was located.
     * If found: Updates the item's `done` property directly to `true` and returns the mutated item.
     * If not found: Halts execution immediately by throwing an error.

  ---


  ### Error Handling

  * **Item Not Found:** Throws a standard JavaScript `Error` with the message `todo not found: <id>`
  if no item in `todos` matches the supplied `id`.


  ---


  ### Edge Cases and Invariants

  * **In-Place Mutation:** Directly modifies the existing object reference inside the `todos` list
  rather than creating an immutable copy.

  * **Idempotency (Already Done):** If the matching item is already marked `done: true`, the method
  reassigns `done = true` without error and returns the item unchanged.

  * **Duplicate Identifiers:** If multiple items in `todos` share the same `id`, only the **first**
  matching item in array order is updated and returned; subsequent duplicates remain unmodified.

  * **Post-condition Invariant:** On successful execution, the returned `Todo` object is guaranteed
  to have `done === true`.
