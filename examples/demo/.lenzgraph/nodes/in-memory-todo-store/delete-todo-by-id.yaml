kind: behavior
title: Delete todo by id
spec: 'Add `remove(id: number): void` to the store. Input: a todo id. If no todo has that id, throw
  an `Error` with message `"todo not found: <id>"`. Otherwise remove that todo from the store.
  Deleting does not affect the id counter: the next added todo still gets the next sequential id, so
  ids are never reused.'
parent: n_9f47be
status: built
