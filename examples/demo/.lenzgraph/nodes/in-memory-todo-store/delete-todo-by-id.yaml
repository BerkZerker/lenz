reconstruction: >-
  `remove(id)` deletes the todo whose `id` equals the given number from the store's in-memory
  `todos` array, mutating the array in place.


  **Behavior**


  - It searches `todos` for the first element whose `id` strictly equals (`===`) the argument.

  - If no match is found, it throws an `Error` with the message `todo not found: <id>` and leaves
  `todos` unchanged.

  - If a match is found, it removes exactly that one element (via `splice(i, 1)`), shifting later
  elements down by one index. It returns nothing (`void`).


  **Edge cases and invariants**


  - Only the first matching todo is removed. If the array contained duplicate ids, later duplicates
  would remain.

  - Matching is strict equality on a `number`, so an `id` that is `NaN` never matches (throws), and
  a string id like `"3"` would not match a numeric `3`.

  - There is no validation of the argument beyond the type annotation; any number is accepted and
  simply either matches or throws "not found".

  - The operation is synchronous and has no return value; callers cannot distinguish success other
  than by the absence of a thrown error.

  - The function does not copy the array — it mutates the closure-captured `todos`, so any external
  reference to that same array will observe the removal. Indices of remaining todos after the
  removed position change.

  - Removing from an empty store always throws.

  - Nothing else is touched: no persistence, events, or side effects beyond the array mutation.
