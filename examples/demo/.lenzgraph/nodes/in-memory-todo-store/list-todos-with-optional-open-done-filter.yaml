reconstruction: >-
  `list` is a method on the object returned by `createStore`. It takes an optional `filter` argument
  and returns an array of `Todo` items drawn from a `todos` array held in the enclosing
  `createStore` scope.


  **Behavior by argument:**


  - **No argument / `undefined`:** Returns a shallow copy of the entire `todos` array
  (`todos.slice()`). Every todo is included regardless of its `done` state. The returned array is a
  new object, so callers adding or removing elements from it do not affect the store; however, the
  `Todo` objects themselves are the same references as in the store, so mutating a returned todo's
  fields does mutate the stored todo.

  - **`"open"`:** Returns a new array containing only todos whose `done` property is falsy
  (`!t.done`). Same aliasing caveat: the array is new, the elements are shared references.

  - **`"done"`:** Returns a new array containing only todos whose `done` property is truthy.

  - **Any other value:** Throws an `Error` with the message `invalid filter: <value>`, where
  `<value>` is the argument stringified via template literal. The type signature restricts `filter`
  to `"open" | "done" | undefined`, so this branch is only reachable from untyped or type-cast
  callers (e.g. JavaScript consumers or `as any`), including cases like `null` (which is not `===
  undefined` and so is not treated as "no filter"), empty string, or other strings.


  **Invariants and edge cases:**


  - The method never returns the internal `todos` array directly; all three success paths return a
  fresh array.

  - Ordering is preserved: results appear in the same relative order as in `todos`.

  - Only exact string equality is accepted; `"Open"`, `" open"`, etc. throw.

  - The `done` check uses truthiness, not strict boolean comparison, so a `Todo` with `done` set to
  a non-boolean truthy/falsy value would be classified accordingly.

  - If `todos` is empty, all success paths return an empty array.

  - The method has no side effects on the store; it does not modify `todos`.
