kind: behavior
title: List todos with optional open/done filter
spec: "Extend `list(filter?: \"open\" | \"done\"): Todo[]` on the store. With no argument, return
  all todos in insertion order. With `\"open\"`, return only todos where `done === false`; with
  `\"done\"`, only those where `done === true`. Any other string value throws an `Error` with
  message `\"invalid filter: <value>\"`. The returned array is a fresh copy (mutating it does not
  affect the store), and each call reflects the store's current state."
parent: n_9f47be
status: built
examples:
  - id: ex_da2f98
    name: lists all
    given: a store with todos "a" (open) and "b" (done)
    when: list() is called
    then: it returns both todos in insertion order [a, b]
    expect:
      mode: exit0
    run: bun test tests/list.test.ts -t ex_da2f98
  - id: ex_55c98f
    name: filters open
    given: a store with todos "a" (open) and "b" (done)
    when: list("open") is called
    then: it returns only [a]
    expect:
      mode: exit0
    run: bun test tests/list.test.ts -t ex_55c98f
  - id: ex_e9e910
    name: filters done
    given: a store with todos "a" (open) and "b" (done)
    when: list("done") is called
    then: it returns only [b]
    expect:
      mode: exit0
    run: bun test tests/list.test.ts -t ex_e9e910
  - id: ex_7551cf
    name: invalid filter errors
