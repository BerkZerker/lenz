kind: behavior
title: Mark todo done by id
spec: "Add `done(id: number): Todo` to the store. Input: a todo id. If no todo has that id, throw an
  `Error` with message `\"todo not found: <id>\"` and do not mutate the store. Otherwise set the
  todo's `done` flag to `true` and return the updated todo. Marking an already-done todo is
  idempotent (still returns it, no error)."
parent: n_9f47be
status: built
