    name: marks done
    given: "a store containing todo id 1 with done: false"
    when: done(1) is called
    then: "it returns { id: 1, title, done: true } and list() shows id 1 as done"
    expect:
      mode: exit0
    run: bun test tests/done.test.ts -t ex_67cbac
  - id: ex_47e6d2
