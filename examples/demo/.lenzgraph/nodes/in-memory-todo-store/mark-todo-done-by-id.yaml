reconstruction: >-
  **`done(id)` — mark a todo as completed**


  Behavior:

  - Looks up the first todo in the store's in-memory `todos` array whose `id` strictly equals
  (`===`) the given `id`.

  - If no matching todo exists, throws an `Error` with the message `todo not found: <id>`. Nothing
  is modified in that case.

  - If found, sets that todo's `done` property to `true` — mutating the object in place inside the
  array — and returns that same object (not a copy).


  Edge cases and invariants:

  - Idempotent: calling `done` on a todo that is already done leaves it `done: true` and returns it
  without error.

  - Only the first match is affected; if duplicate IDs existed in the array, only the first would be
  marked. (Whether duplicates can exist is not determined by this code.)

  - No validation of `id` beyond the equality check: a non-integer, negative, `NaN`, or otherwise
  unmatched value results in the "not found" error. `NaN` never matches since `NaN === NaN` is
  false.

  - The returned object is a live reference: callers who modify it will modify the store's state.

  - No other fields of the todo are touched; no timestamps or side effects beyond the `done` flag
  are recorded.

  - The method is synchronous and returns a `Todo`; it never returns `undefined` — failure is
  signaled only by the thrown error.
