    expect:
      mode: exit0
    run: bun test tests/done.test.ts -t ex_47e6d2
  - id: ex_0affda
    name: idempotent
    given: a store where done(1) was already called
    when: done(1) is called again
    then: "it returns the todo with done: true and does not throw"
    expect:
      mode: exit0
    run: bun test tests/done.test.ts -t ex_0affda
